<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#050a14">
    <title>IA Vocal — Vision + Voix</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{--bg:#050a14;--card:rgba(12,18,32,0.85);--accent:#00bfff;--accent2:#00ffaa;--text:#d0daf0;--dim:#556688;--danger:#ff4466}
        body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro','Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;-webkit-user-select:none;user-select:none}

        .page{display:none;position:fixed;inset:0;flex-direction:column;z-index:10}
        .page.on{display:flex}

        #welcome{background:radial-gradient(ellipse at 50% 40%,#0d1a30 0%,#050a14 70%);align-items:center;justify-content:center;gap:20px;padding:20px}
        .w-orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#00ddff,#0066cc 55%,#001a33 80%,transparent);box-shadow:0 0 50px #00aaff44,0 0 100px #0066cc22;animation:breathe 3s ease-in-out infinite}
        @keyframes breathe{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.08);filter:brightness(1.2)}}
        .w-title{font-size:26px;font-weight:700;letter-spacing:.5px;margin-top:8px}
        .w-sub{font-size:13px;color:var(--dim);text-align:center;line-height:1.6}
        .w-features{display:flex;gap:18px;font-size:11px;color:var(--dim);margin:12px 0 28px}
        .w-features span{display:flex;align-items:center;gap:4px}
        .w-btn{padding:18px 64px;border:none;border-radius:14px;background:linear-gradient(135deg,#0088ee,#0055aa);color:#fff;font-size:19px;font-weight:600;cursor:pointer;transition:all .15s;touch-action:manipulation;min-width:200px;min-height:56px}
        .w-btn:active{transform:scale(.95)}

        #active{background:#000}
        #cam{position:absolute;inset:0;object-fit:cover;width:100%;height:100%;opacity:.3;z-index:1}
        #cam.mirror{transform:scaleX(-1)}
        .dim{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(5,10,20,.85) 0%,rgba(5,10,20,.2) 35%,rgba(5,10,20,.5) 100%)}

        .top{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
        .top-left{display:flex;align-items:center;gap:8px}
        .top-right{display:flex;align-items:center;gap:6px}
        .dot{width:8px;height:8px;border-radius:50%;background:#333;transition:all .3s}
        .dot.on{background:#00ff88;box-shadow:0 0 6px #00ff88}
        .dot.rec{background:var(--danger);box-shadow:0 0 6px var(--danger);animation:blink 1s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
        .dot.talk{background:var(--accent2);box-shadow:0 0 6px var(--accent2)}
        .lbl{font-size:11px;color:var(--dim)}
        .btn-icon{background:none;border:none;color:var(--dim);font-size:22px;padding:6px 10px;line-height:1;cursor:pointer;touch-action:manipulation}
        .btn-icon:active{opacity:.5}

        #chat{position:absolute;top:46px;bottom:130px;left:0;right:0;z-index:20;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
        #chat::-webkit-scrollbar{width:0}
        .msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.55;animation:pop .25s ease-out;word-wrap:break-word}
        @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
        .msg.me{align-self:flex-end;background:#0060bb;color:#fff;border-bottom-right-radius:4px}
        .msg.ai{align-self:flex-start;background:var(--card);color:#ccd8ee;border-bottom-left-radius:4px;border:1px solid rgba(0,191,255,.1)}
        .msg.ai .cursor{display:inline-block;width:2px;height:13px;background:var(--accent);margin-left:2px;animation:blink .6s infinite;vertical-align:text-bottom}
        .msg.ai .replay-btn{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:8px;background:rgba(0,191,255,.15);color:var(--accent);font-size:11px;cursor:pointer;border:none;touch-action:manipulation}

        #orb-wrap{position:absolute;bottom:145px;left:0;right:0;z-index:15;display:flex;justify-content:center;pointer-events:none}
        #orb{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--accent),#005599 60%,transparent 72%);opacity:0;transition:all .4s}
        #orb.idle{opacity:.6;animation:breathe 3s ease-in-out infinite}
        #orb.speaking{opacity:1;animation:speak 1.2s ease-in-out infinite;background:radial-gradient(circle at 40% 35%,var(--accent2),#007755 60%,transparent 72%);box-shadow:0 0 30px #00ffaa33}
        @keyframes speak{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

        .bottom{position:absolute;bottom:0;left:0;right:0;z-index:30;padding:10px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(180deg,transparent 0%,rgba(5,10,20,.9) 30%)}
        .input-row{display:flex;width:100%;max-width:480px;gap:6px}
        .input-row input{flex:1;padding:10px 14px;border-radius:12px;border:1px solid #223;background:rgba(10,15,25,.9);color:#fff;font-size:14px;outline:none}
        .input-row input:focus{border-color:var(--accent)}
        .input-row button{padding:10px 16px;border:none;border-radius:12px;background:#0066cc;color:#fff;font-size:13px;font-weight:600;cursor:pointer;touch-action:manipulation}
        .mic-area{display:flex;align-items:center;gap:14px}
        #mic{width:56px;height:56px;border-radius:50%;border:2.5px solid var(--accent);background:rgba(0,136,255,.1);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;touch-action:manipulation}
        #mic.on{border-color:var(--danger);background:rgba(255,50,50,.15);animation:blink 1.2s infinite}
        #mic:active{transform:scale(.93)}

        .frame-dot{position:absolute;top:10px;right:10px;z-index:25;width:6px;height:6px;border-radius:50%;background:var(--accent2);opacity:0;transition:opacity .15s}
        .frame-dot.flash{opacity:1}

        #audio-status{position:absolute;top:36px;right:14px;z-index:35;font-size:10px;color:var(--dim);background:rgba(0,0,0,.5);padding:2px 8px;border-radius:8px;display:none}
    </style>
</head>
<body>

<div id="welcome" class="page on">
    <div class="w-orb"></div>
    <div class="w-title">Assistant IA Vocal</div>
    <div class="w-sub">Je vois à travers la caméra,<br>j'écoute et je te réponds avec une vraie voix.</div>
    <div class="w-features">
        <span>👁️ Vision temps réel</span>
        <span>🗣️ Voix naturelle</span>
        <span>🧠 Mistral IA</span>
    </div>
    <button class="w-btn" id="go">▶ Parler</button>
    <div style="color:var(--dim);font-size:10px;margin-top:12px;text-align:center;line-height:1.5">
        Nécessite le serveur : <code style="background:#1a2233;padding:2px 6px;border-radius:4px">python server.py</code>
    </div>
    <a href="photomaton.html" style="color:var(--dim);font-size:11px;margin-top:4px;text-decoration:none">→ Photomaton ID</a>
</div>

<div id="active" class="page">
    <video id="cam" autoplay playsinline muted></video>
    <div class="dim"></div>
    <div class="frame-dot" id="fdot"></div>
    <div id="audio-status"></div>
    <div class="top">
        <div class="top-left">
            <div class="dot" id="dot"></div>
            <span class="lbl" id="lbl">En attente...</span>
        </div>
        <div class="top-right">
            <button class="btn-icon" id="switch-cam" title="Caméra">🔄</button>
            <button class="btn-icon" id="quit">✕</button>
        </div>
    </div>
    <div id="chat"></div>
    <div id="orb-wrap"><div id="orb"></div></div>
    <div class="bottom">
        <div class="input-row">
            <input id="inp" placeholder="Écris ou parle..." autocomplete="off"/>
            <button id="send">OK</button>
        </div>
        <div class="mic-area">
            <button id="mic">🎤</button>
        </div>
    </div>
</div>

<canvas id="cv" style="display:none"></canvas>

<script>
(function(){
var $=function(id){return document.getElementById(id)};
var chatEl=$('chat'),camEl=$('cam'),cv=$('cv'),ctx=cv.getContext('2d');
var dotEl=$('dot'),lblEl=$('lbl'),orbEl=$('orb'),fdotEl=$('fdot'),audioStatus=$('audio-status');
var stream=null,frameTimer=null,rec=null,active=false,speaking=false;
var history=[],latestFrame=null,waitingAI=false,facingMode='environment';
var lastAudioB64=null; // stocke le dernier audio pour replay

/* ============ AUDIO ENGINE ============ */
var audioCtx=null;
var audioEl=new Audio();
audioEl.setAttribute('playsinline','');
audioEl.setAttribute('preload','auto');

function getAudioCtx(){
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    return audioCtx;
}

function unlockAudio(){
    try{
        var ctx=getAudioCtx();
        // Joue un silence via Web Audio pour déverrouiller
        var buf=ctx.createBuffer(1,1,22050);
        var src=ctx.createBufferSource();
        src.buffer=buf;src.connect(ctx.destination);src.start(0);
        console.log('[Audio] Web Audio unlocked, state='+ctx.state);
    }catch(e){console.warn('[Audio] Web Audio unlock failed',e)}

    try{
        audioEl.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
        audioEl.play().then(function(){console.log('[Audio] <audio> unlocked')}).catch(function(){});
    }catch(e){}
}

function showAudioStatus(text){
    audioStatus.textContent=text;audioStatus.style.display='block';
    setTimeout(function(){audioStatus.style.display='none'},3000);
}

function playAudioFromB64(b64){
    lastAudioB64=b64;
    return new Promise(function(resolve){
        try{
            var raw=atob(b64);
            var u8=new Uint8Array(raw.length);
            for(var i=0;i<raw.length;i++)u8[i]=raw.charCodeAt(i);
            var blob=new Blob([u8],{type:'audio/wav'});
            var url=URL.createObjectURL(blob);

            // Méthode 1: <audio> element (fiable sur PC + mobile)
            audioEl.src=url;
            audioEl.onended=function(){
                URL.revokeObjectURL(url);
                console.log('[Audio] Play OK via <audio>');
                resolve(true);
            };
            audioEl.onerror=function(e){
                console.warn('[Audio] <audio> failed, trying Web Audio');
                URL.revokeObjectURL(url);
                // Méthode 2: Web Audio API
                playViaWebAudio(b64).then(resolve).catch(function(){resolve(false)});
            };
            audioEl.play().then(function(){
                console.log('[Audio] <audio>.play() started');
            }).catch(function(e){
                console.warn('[Audio] <audio>.play() blocked:',e.message);
                URL.revokeObjectURL(url);
                playViaWebAudio(b64).then(resolve).catch(function(){resolve(false)});
            });
        }catch(e){
            console.error('[Audio] playAudioFromB64 error:',e);
            resolve(false);
        }
    });
}

function playViaWebAudio(b64){
    return new Promise(function(resolve,reject){
        try{
            var ctx=getAudioCtx();
            var raw=atob(b64);
            var u8=new Uint8Array(raw.length);
            for(var i=0;i<raw.length;i++)u8[i]=raw.charCodeAt(i);
            ctx.decodeAudioData(u8.buffer).then(function(audioBuf){
                var src=ctx.createBufferSource();
                src.buffer=audioBuf;
                src.connect(ctx.destination);
                src.onended=function(){console.log('[Audio] Web Audio playback ended');resolve(true)};
                src.start(0);
                console.log('[Audio] Web Audio playback started');
            }).catch(function(e){
                console.warn('[Audio] decodeAudioData failed:',e);
                reject(e);
            });
        }catch(e){reject(e)}
    });
}

function replayLastAudio(){
    if(!lastAudioB64){showAudioStatus('Pas de audio');return}
    speaking=true;orbEl.className='speaking';
    showAudioStatus('🔊 Relecture...');
    playAudioFromB64(lastAudioB64).then(function(){
        speaking=false;orbEl.className='idle';showAudioStatus('');
    });
}

/* ============ UI ============ */
function show(id){
    var pages=document.querySelectorAll('.page');
    for(var i=0;i<pages.length;i++)pages[i].classList.remove('on');
    $(id).classList.add('on');
}
function stat(t,m){
    lblEl.textContent=t;dotEl.className='dot';
    if(m==='on')dotEl.classList.add('on');
    else if(m==='rec')dotEl.classList.add('rec');
    else if(m==='talk')dotEl.classList.add('talk');
}

function addMsg(text,who){
    var d=document.createElement('div');
    d.className='msg '+(who==='me'?'me':'ai');
    d.textContent=text;
    chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;
    return d;
}

function addMsgWithReplay(text,audioB64){
    var d=document.createElement('div');
    d.className='msg ai';
    d.textContent=text;
    if(audioB64){
        var btn=document.createElement('button');
        btn.className='replay-btn';btn.textContent='🔊';
        btn.addEventListener('click',function(){
            speaking=true;orbEl.className='speaking';
            playAudioFromB64(audioB64).then(function(){
                speaking=false;orbEl.className='idle';
            });
        });
        btn.addEventListener('touchend',function(e){
            e.preventDefault();btn.click();
        });
        d.appendChild(btn);
    }
    chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;
    return d;
}

function addTyping(){
    var d=document.createElement('div');
    d.className='msg ai';d.innerHTML='<span class="cursor"></span>';
    chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;
    return d;
}
function typeText(el,text){
    return new Promise(function(res){
        var i=0;
        var iv=setInterval(function(){
            if(i<text.length){el.textContent=text.slice(0,++i);chatEl.scrollTop=chatEl.scrollHeight}
            else{clearInterval(iv);res()}
        },18);
    });
}

/* ============ CAMERA ============ */
function stopCam(){
    if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
    if(frameTimer){clearInterval(frameTimer);frameTimer=null}
}
function startCam(){
    return navigator.mediaDevices.getUserMedia({
        video:{facingMode:facingMode,width:{ideal:640},height:{ideal:480}},audio:false
    }).then(function(s){
        stream=s;camEl.srcObject=s;
        camEl.classList.toggle('mirror',facingMode==='user');
        frameTimer=setInterval(function(){
            if(!camEl.videoWidth)return;
            cv.width=320;cv.height=240;
            ctx.save();ctx.translate(cv.width,0);ctx.scale(-1,1);
            ctx.drawImage(camEl,0,0,320,240);ctx.restore();
            latestFrame=cv.toDataURL('image/jpeg',0.5).split(',')[1];
            fdotEl.classList.add('flash');setTimeout(function(){fdotEl.classList.remove('flash')},150);
        },3000);
        return true;
    });
}
function switchCam(){
    facingMode=facingMode==='environment'?'user':'environment';
    stopCam();startCam().catch(function(e){console.warn(e)});
}

/* ============ MIC ============ */
function startMic(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){stat('Speech non supporté','');return}
    rec=new SR();rec.continuous=true;rec.interimResults=false;rec.lang='fr-FR';
    rec.onresult=function(e){
        for(var i=e.resultIndex;i<e.results.length;i++){
            if(e.results[i].isFinal){
                var t=e.results[i][0].transcript.trim();
                if(t)onUserText(t);
            }
        }
    };
    rec.onend=function(){if(active)try{rec.start()}catch(e){}};
    rec.onerror=function(e){if(active&&e.error!=='no-speech'&&e.error!=='aborted')setTimeout(function(){try{rec.start()}catch(e){}},800)};
    try{rec.start();stat('En écoute','rec');$('mic').classList.add('on')}catch(e){}
}
function stopMic(){if(rec){rec.abort();rec=null}$('mic').classList.remove('on')}

/* ============ AI ============ */
var API_KEY='SPZpcRQzWUu8iEC1XrcNwEOOcLH45qis';
var IS_LOCAL=location.hostname==='localhost'||location.hostname==='127.0.0.1';
var SYS_PROMPT="Tu es un assistant IA vocal avancé. Tu vois en temps réel ce que la caméra filme et tu écoutes l'utilisateur. Tu discutes comme un humain, réponses courtes et naturelles. Décris ce que tu observes, sans inventer. Ton chaleureux et dynamique. 2-3 phrases max. Style conversationnel. Tu n'es jamais un robot.";

function callMistralChat(messages,model){
    if(IS_LOCAL)return Promise.resolve(null);
    model=model||'pixtral-large-latest';
    return fetch('https://api.mistral.ai/v1/chat/completions',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
        body:JSON.stringify({model:model,messages:messages,max_tokens:250,temperature:0.7})
    }).then(function(r){if(!r.ok)throw new Error('Chat '+r.status);return r.json()})
      .then(function(d){return d.choices[0].message.content});
}

function callMistralTTS(text){
    if(IS_LOCAL)return Promise.resolve(null);
    return fetch('https://api.mistral.ai/v1/audio/speech',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
        body:JSON.stringify({model:'voxtral-mini-tts-2603',input:text,voice_id:'c69964a6-ab8b-4f8a-9465-ec0925096ec8',response_format:'wav'})
    }).then(function(r){if(!r.ok)throw new Error('TTS '+r.status);return r.arrayBuffer()})
      .then(function(buf){var u8=new Uint8Array(buf),b='';for(var i=0;i<u8.length;i++)b+=String.fromCharCode(u8[i]);return btoa(b)});
}

function onUserText(text){
    if(!text||waitingAI)return;
    addMsg(text,'me');
    history.push({role:'user',content:text});
    if(history.length>30)history=history.slice(-20);
    waitingAI=true;
    var typing=addTyping();
    stat('Réflexion...','on');

    var promise;

    if(IS_LOCAL){
        // ---- LOCALHOST: tout via le backend ----
        promise=fetch('/api/ia',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({text:text,image:latestFrame,history:history.slice(-20)})
        }).then(function(r){if(!r.ok)throw new Error('Serveur '+r.status);return r.json()})
          .then(function(d){return{aiText:d.text,audioB64:d.audio_data||'',error:d.error}});
    }else{
        // ---- GITHUB PAGES: appels directs Mistral ----
        var msgs=[{role:'system',content:SYS_PROMPT}].concat(history.slice(-20));
        if(latestFrame){
            var userContent=[{type:'image_url',image_url:'data:image/jpeg;base64,'+latestFrame},{type:'text',text:text}];
            msgs.push({role:'user',content:userContent});
        }else{
            msgs.push({role:'user',content:text});
        }

        promise=callMistralChat(msgs).then(function(aiText){
            return callMistralTTS(aiText).then(function(audioB64){
                return{aiText:aiText,audioB64:audioB64};
            });
        }).catch(function(){
            return callMistralChat(msgs,'mistral-large-latest').then(function(aiText){
                return callMistralTTS(aiText).then(function(audioB64){
                    return{aiText:aiText,audioB64:audioB64};
                });
            });
        });
    }

    promise.then(function(result){
        if(result.error)throw new Error(result.error);
        console.log('[IA] OK:',result.aiText.substring(0,60),'audio:',result.audioB64?'YES':'NO');
        typing.remove();
        addMsgWithReplay(result.aiText,result.audioB64||null);
        history.push({role:'assistant',content:result.aiText});
        if(result.audioB64){
            stat('Parle...','talk');speaking=true;orbEl.className='speaking';
            return playAudioFromB64(result.audioB64);
        }else{
            showAudioStatus('Pas de voix');return false;
        }
    }).then(function(){
        speaking=false;orbEl.className='idle';
        stat(active&&rec?'En écoute':'Connecté',active&&rec?'rec':'on');
        waitingAI=false;
    }).catch(function(e){
        console.error('[IA] Error:',e);
        typing.textContent='Erreur : '+e.message;
        speaking=false;orbEl.className='idle';
        stat(active&&rec?'En écoute':'Connecté',active&&rec?'rec':'on');
        waitingAI=false;
    });
}

/* ============ LIFECYCLE ============ */
function start(){
    console.log('[IA] START');
    show('active');stat('Caméra...','on');active=true;
    unlockAudio();

    startCam().then(function(){
        orbEl.className='idle';stat('Connecté','on');startMic();
        typeText(addTyping(),"Salut ! Je vois ce que filme ta caméra. Montre-moi quelque chose ou parle-moi !").then(function(){});
        history.push({role:'assistant',content:'Salut ! Je vois ce que filme ta caméra. Montre-moi quelque chose ou parle-moi !'});
    }).catch(function(e){
        console.error('Cam error:',e);stat('Cam','on');startMic();
        typeText(addTyping(),"Pas de caméra mais on peut discuter !").then(function(){});
    });
}

function quit(){
    active=false;stopMic();stopCam();chatEl.innerHTML='';history=[];latestFrame=null;lastAudioB64=null;
    try{audioEl.pause();audioEl.src=''}catch(e){}
    orbEl.className='';show('welcome');stat('En attente...','');
}

/* ============ EVENTS ============ */
function bind(id,fn){
    var el=$(id);if(!el)return;
    el.addEventListener('click',function(e){e.preventDefault();fn()});
    el.addEventListener('touchend',function(e){e.preventDefault();fn()});
}
bind('go',start);
bind('quit',quit);
bind('switch-cam',switchCam);
bind('send',function(){var t=$('inp').value.trim();if(t){$('inp').value='';onUserText(t)}});
bind('mic',function(){if(active){if(rec){stopMic();stat('Pause','on')}else startMic()}});
$('inp').addEventListener('keydown',function(e){if(e.key==='Enter')$('send').click()});
})();
</script>
</body>
</html>
