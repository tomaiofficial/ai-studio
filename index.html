<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#050a14">
    <title>IA Vocal — Vision + Voix</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{--bg:#050a14;--card:rgba(12,18,32,0.85);--accent:#00bfff;--accent2:#00ffaa;--text:#d0daf0;--dim:#556688;--danger:#ff4466}
        body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro','Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;-webkit-user-select:none;user-select:none}

        .page{display:none;position:fixed;inset:0;flex-direction:column;z-index:10}
        .page.on{display:flex}

        /* Welcome */
        #welcome{background:radial-gradient(ellipse at 50% 40%,#0d1a30 0%,#050a14 70%);align-items:center;justify-content:center;gap:20px;padding:20px}
        .w-orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#00ddff,#0066cc 55%,#001a33 80%,transparent);box-shadow:0 0 50px #00aaff44,0 0 100px #0066cc22;animation:breathe 3s ease-in-out infinite}
        @keyframes breathe{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.08);filter:brightness(1.2)}}
        .w-title{font-size:26px;font-weight:700;letter-spacing:.5px;margin-top:8px}
        .w-sub{font-size:13px;color:var(--dim);text-align:center;line-height:1.6}
        .w-features{display:flex;gap:18px;font-size:11px;color:var(--dim);margin:12px 0 28px}
        .w-features span{display:flex;align-items:center;gap:4px}
        .w-btn{padding:18px 64px;border:none;border-radius:14px;background:linear-gradient(135deg,#0088ee,#0055aa);color:#fff;font-size:19px;font-weight:600;cursor:pointer;transition:all .15s;touch-action:manipulation;min-width:200px;min-height:56px}
        .w-btn:active{transform:scale(.95);background:linear-gradient(135deg,#0077dd,#004499)}

        /* Active */
        #active{background:#000}
        #cam{position:absolute;inset:0;object-fit:cover;width:100%;height:100%;opacity:.3;z-index:1}
        #cam.mirror{transform:scaleX(-1)}
        .dim{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(5,10,20,.85) 0%,rgba(5,10,20,.2) 35%,rgba(5,10,20,.5) 100%)}

        .top{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
        .top-left{display:flex;align-items:center;gap:8px}
        .top-right{display:flex;align-items:center;gap:6px}
        .dot{width:8px;height:8px;border-radius:50%;background:#333;transition:all .3s}
        .dot.on{background:#00ff88;box-shadow:0 0 6px #00ff88}
        .dot.rec{background:var(--danger);box-shadow:0 0 6px var(--danger);animation:blink 1s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
        .dot.talk{background:var(--accent2);box-shadow:0 0 6px var(--accent2)}
        .lbl{font-size:11px;color:var(--dim)}
        .btn-icon{background:none;border:none;color:var(--dim);font-size:22px;padding:6px 10px;line-height:1;cursor:pointer;touch-action:manipulation}
        .btn-icon:active{opacity:.5}

        #chat{position:absolute;top:46px;bottom:130px;left:0;right:0;z-index:20;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
        #chat::-webkit-scrollbar{width:0}
        .msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.55;animation:pop .25s ease-out;word-wrap:break-word}
        @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
        .msg.me{align-self:flex-end;background:#0060bb;color:#fff;border-bottom-right-radius:4px}
        .msg.ai{align-self:flex-start;background:var(--card);color:#ccd8ee;border-bottom-left-radius:4px;border:1px solid rgba(0,191,255,.1)}
        .msg.ai .cursor{display:inline-block;width:2px;height:13px;background:var(--accent);margin-left:2px;animation:blink .6s infinite;vertical-align:text-bottom}

        #orb-wrap{position:absolute;bottom:145px;left:0;right:0;z-index:15;display:flex;justify-content:center;pointer-events:none}
        #orb{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--accent),#005599 60%,transparent 72%);opacity:0;transition:all .4s}
        #orb.idle{opacity:.6;animation:breathe 3s ease-in-out infinite}
        #orb.speaking{opacity:1;animation:speak 1.2s ease-in-out infinite;background:radial-gradient(circle at 40% 35%,var(--accent2),#007755 60%,transparent 72%);box-shadow:0 0 30px #00ffaa33}
        @keyframes speak{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

        .bottom{position:absolute;bottom:0;left:0;right:0;z-index:30;padding:10px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;background:linear-gradient(180deg,transparent 0%,rgba(5,10,20,.9) 30%)}
        .input-row{display:flex;width:100%;max-width:480px;gap:6px}
        .input-row input{flex:1;padding:10px 14px;border-radius:12px;border:1px solid #223;background:rgba(10,15,25,.9);color:#fff;font-size:14px;outline:none}
        .input-row input:focus{border-color:var(--accent)}
        .input-row button{padding:10px 16px;border:none;border-radius:12px;background:#0066cc;color:#fff;font-size:13px;font-weight:600;cursor:pointer;touch-action:manipulation}
        .mic-area{display:flex;align-items:center;gap:14px}
        .vol{width:36px;height:3px;background:#1a2233;border-radius:2px;overflow:hidden}
        .vol i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .08s}
        #mic{width:56px;height:56px;border-radius:50%;border:2.5px solid var(--accent);background:rgba(0,136,255,.1);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;touch-action:manipulation}
        #mic.on{border-color:var(--danger);background:rgba(255,50,50,.15);animation:blink 1.2s infinite}
        #mic:active{transform:scale(.93)}

        .frame-dot{position:absolute;top:10px;right:10px;z-index:25;width:6px;height:6px;border-radius:50%;background:var(--accent2);opacity:0;transition:opacity .15s}
        .frame-dot.flash{opacity:1}
    </style>
</head>
<body>

<div id="welcome" class="page on">
    <div class="w-orb"></div>
    <div class="w-title">Assistant IA Vocal</div>
    <div class="w-sub">Je vois à travers la caméra,<br>j'écoute et je te réponds avec une vraie voix.</div>
    <div class="w-features">
        <span>👁️ Vision temps réel</span>
        <span>🗣️ Voix naturelle</span>
        <span>🧠 Mistral IA</span>
    </div>
    <button class="w-btn" id="go">▶ Parler</button>
    <div style="color:var(--dim);font-size:10px;margin-top:12px;text-align:center;line-height:1.5">
        ⚠️ Nécessite le serveur local : <code style="background:#1a2233;padding:2px 6px;border-radius:4px">python server.py</code><br>
        Puis ouvrir <code style="background:#1a2233;padding:2px 6px;border-radius:4px">http://localhost:8080</code>
    </div>
    <a href="photomaton.html" style="color:var(--dim);font-size:11px;margin-top:4px;text-decoration:none">→ Photomaton ID</a>
</div>

<div id="active" class="page">
    <video id="cam" autoplay playsinline muted></video>
    <div class="dim"></div>
    <div class="frame-dot" id="fdot"></div>
    <div class="top">
        <div class="top-left">
            <div class="dot" id="dot"></div>
            <span class="lbl" id="lbl">En attente...</span>
        </div>
        <div class="top-right">
            <button class="btn-icon" id="switch-cam" title="Retourner la caméra">🔄</button>
            <button class="btn-icon" id="quit">✕</button>
        </div>
    </div>
    <div id="chat"></div>
    <div id="orb-wrap"><div id="orb"></div></div>
    <div class="bottom">
        <div class="input-row">
            <input id="inp" placeholder="Écris ou parle..." autocomplete="off"/>
            <button id="send">OK</button>
        </div>
        <div class="mic-area">
            <div class="vol"><i id="v1"></i></div>
            <button id="mic">🎤</button>
            <div class="vol"><i id="v2"></i></div>
        </div>
    </div>
</div>

<canvas id="cv" style="display:none"></canvas>
<audio id="tts" style="display:none"></audio>

<script>
(function(){
var $=function(id){return document.getElementById(id)};
var chatEl=$('chat'),camEl=$('cam'),cv=$('cv'),ctx=cv.getContext('2d'),ttsEl=$('tts');
var dotEl=$('dot'),lblEl=$('lbl'),orbEl=$('orb'),fdotEl=$('fdot');
var stream=null,frameTimer=null,rec=null,audioUnlocked=false,active=false,speaking=false;
var history=[],latestFrame=null,waitingAI=false;
var facingMode='environment';

function show(id){
    var pages=document.querySelectorAll('.page');
    for(var i=0;i<pages.length;i++)pages[i].classList.remove('on');
    $(id).classList.add('on');
}
function stat(t,m){
    lblEl.textContent=t;
    dotEl.className='dot';
    if(m==='on')dotEl.classList.add('on');
    else if(m==='rec')dotEl.classList.add('rec');
    else if(m==='talk')dotEl.classList.add('talk');
}

function addMsg(text,who){
    var d=document.createElement('div');
    d.className='msg '+(who==='me'?'me':'ai');
    d.textContent=text;
    chatEl.appendChild(d);
    chatEl.scrollTop=chatEl.scrollHeight;
    return d;
}
function addTyping(){
    var d=document.createElement('div');
    d.className='msg ai';
    d.innerHTML='<span class="cursor"></span>';
    chatEl.appendChild(d);
    chatEl.scrollTop=chatEl.scrollHeight;
    return d;
}
function typeText(el,text){
    return new Promise(function(res){
        var i=0;
        var iv=setInterval(function(){
            if(i<text.length){el.textContent=text.slice(0,++i);chatEl.scrollTop=chatEl.scrollHeight}
            else{clearInterval(iv);res()}
        },18);
    });
}

function stopCam(){
    if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
    if(frameTimer){clearInterval(frameTimer);frameTimer=null}
}

function startCam(){
    return navigator.mediaDevices.getUserMedia({
        video:{facingMode:facingMode,width:{ideal:640},height:{ideal:480}},
        audio:false
    }).then(function(s){
        stream=s;
        camEl.srcObject=s;
        if(facingMode==='user')camEl.classList.add('mirror');
        else camEl.classList.remove('mirror');
        frameTimer=setInterval(function(){
            if(!camEl.videoWidth)return;
            cv.width=320;cv.height=240;
            ctx.save();
            ctx.translate(cv.width,0);
            ctx.scale(-1,1);
            ctx.drawImage(camEl,0,0,320,240);
            ctx.restore();
            latestFrame=cv.toDataURL('image/jpeg',0.5).split(',')[1];
            fdotEl.classList.add('flash');setTimeout(function(){fdotEl.classList.remove('flash')},150);
        },3000);
        return true;
    });
}

function switchCam(){
    facingMode=facingMode==='environment'?'user':'environment';
    stopCam();
    startCam().catch(function(e){console.warn('Cam switch error',e)});
}

function startMic(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){stat('Speech non supporté','');return}
    rec=new SR();rec.continuous=true;rec.interimResults=false;rec.lang='fr-FR';
    rec.onresult=function(e){
        for(var i=e.resultIndex;i<e.results.length;i++){
            if(e.results[i].isFinal){
                var t=e.results[i][0].transcript.trim();
                if(t)onUserText(t);
            }
        }
    };
    rec.onend=function(){if(active)try{rec.start()}catch(e){}};
    rec.onerror=function(e){if(active&&e.error!=='no-speech'&&e.error!=='aborted')setTimeout(function(){try{rec.start()}catch(e){}},800)};
    try{rec.start();stat('En écoute','rec');$('mic').classList.add('on')}catch(e){console.warn('Mic error',e)}
}
function stopMic(){if(rec){rec.abort();rec=null}$('mic').classList.remove('on')}

var API_KEY='hqC6t0vj7Mqkesum4ZhrVv6Qgxg3VZMy';
var backendOk=false;

/* Check si le backend tourne */
fetch('/api/ia',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'test'})})
.then(function(){backendOk=true})
.catch(function(){backendOk=false});

/* Appel unique au backend /api/ia (vision + chat + TTS) */
function callAI(text,imageB64,historyArr){
    return fetch('/api/ia',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text:text,image:imageB64,history:historyArr})
    }).then(function(r){if(!r.ok)throw new Error('Serveur '+r.status);return r.json()});
}
function playAudioB64(b64){
    return new Promise(function(resolve){
        var raw=atob(b64);var u8=new Uint8Array(raw.length);
        for(var i=0;i<raw.length;i++)u8[i]=raw.charCodeAt(i);
        var blob=new Blob([u8],{type:'audio/wav'});var url=URL.createObjectURL(blob);
        ttsEl.src=url;
        ttsEl.play().then(function(){
            ttsEl.onended=function(){URL.revokeObjectURL(url);resolve()};
        }).catch(function(){URL.revokeObjectURL(url);resolve()});
    });
}

function onUserText(text){
    if(!text||waitingAI)return;
    addMsg(text,'me');
    history.push({role:'user',content:text});
    if(history.length>30)history=history.slice(-20);
    waitingAI=true;
    var typing=addTyping();
    stat('Réflexion...','on');

    callAI(text,latestFrame,history.slice(-20)).then(function(data){
        if(data.error)throw new Error(data.error);
        return typeText(typing,data.text).then(function(){
            history.push({role:'assistant',content:data.text});
            if(data.audio_data){
                stat('Parle...','talk');speaking=true;orbEl.className='speaking';
                return playAudioB64(data.audio_data);
            }
        });
    }).then(function(){
        speaking=false;orbEl.className='idle';
        stat(active&&rec?'En écoute':'Connecté',active&&rec?'rec':'on');
        waitingAI=false;
    }).catch(function(e){
        console.error(e);typing.textContent='Erreur : '+e.message;
        speaking=false;orbEl.className='idle';
        stat(active&&rec?'En écoute':'Connecté',active&&rec?'rec':'on');
        waitingAI=false;
    });
}

function start(){
    console.log('[IA] START clicked, backend:',backendOk);
    show('active');
    stat('Caméra...','on');
    active=true;

    // Unlock audio
    try{ttsEl.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';ttsEl.play().then(function(){audioUnlocked=true}).catch(function(){audioUnlocked=true})}catch(e){audioUnlocked=true}

    startCam().then(function(){
        orbEl.className='idle';stat('Connecté','on');startMic();
        if(!backendOk){
            var g="Attention : le serveur local ne tourne pas. Lancez 'python server.py' puis rechargez la page.";
            typeText(addTyping(),g);history.push({role:'assistant',content:g});
        }else{
            var g="Salut ! Je suis ton assistant vocal. Je vois ce que filme ta caméra. Montre-moi quelque chose ou parle-moi !";
            typeText(addTyping(),g);history.push({role:'assistant',content:g});
        }
    }).catch(function(e){
        console.error('Cam error:',e);stat('Caméra refusée','on');startMic();
        if(!backendOk){
            var g="Pas de caméra et pas de serveur. Lancez 'python server.py' et autorisez la caméra.";
            typeText(addTyping(),g);history.push({role:'assistant',content:g});
        }else{
            var g="Pas de caméra mais on peut discuter ! Parle-moi.";
            typeText(addTyping(),g);history.push({role:'assistant',content:g});
        }
    });
}

function quit(){
    active=false;stopMic();stopCam();chatEl.innerHTML='';history=[];latestFrame=null;
    orbEl.className='';show('welcome');stat('En attente...','');
}

/* ---- Events: click + touchend + pointerdown pour mobile ---- */
function bindBtn(id,fn){
    var el=$(id);if(!el)return;
    el.addEventListener('click',function(e){e.preventDefault();fn()});
    el.addEventListener('touchend',function(e){e.preventDefault();fn()});
}
bindBtn('go',start);
bindBtn('quit',quit);
bindBtn('switch-cam',switchCam);
bindBtn('send',function(){var t=$('inp').value.trim();if(t){$('inp').value='';onUserText(t)}});
$('mic').addEventListener('click',function(){if(active){if(rec){stopMic();stat('Pause','on')}else startMic()}});
$('mic').addEventListener('touchend',function(e){e.preventDefault();if(active){if(rec){stopMic();stat('Pause','on')}else startMic()}});
$('inp').addEventListener('keydown',function(e){if(e.key==='Enter')$('send').click()});
})();
</script>
</body>
</html>
