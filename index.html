<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo France</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
        body { background: linear-gradient(180deg, #1e3a5f 0%, #2b5876 100%); min-height: 100vh; color: white; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; }
        .header h1 { font-size: 32px; font-weight: 600; }
        .header button { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        
        /* Search */
        .search { background: rgba(255,255,255,0.15); border-radius: 12px; padding: 14px; margin-bottom: 20px; }
        .search input { background: none; border: none; color: white; width: 100%; font-size: 16px; outline: none; }
        .search input::placeholder { color: rgba(255,255,255,0.5); }
        
        /* Current */
        .current { text-align: center; padding: 30px 0; }
        .city { font-size: 28px; font-weight: 500; margin-bottom: 10px; }
        .icon { font-size: 90px; line-height: 1; }
        .temp { font-size: 80px; font-weight: 200; letter-spacing: -3px; }
        .desc { font-size: 20px; opacity: 0.85; margin-bottom: 8px; }
        .hl { font-size: 18px; opacity: 0.7; }
        
        /* Scroll forecast */
        .scroll-title { font-size: 14px; font-weight: 600; opacity: 0.6; margin: 25px 0 15px; }
        .scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 20px; scrollbar-width: none; }
        .scroll::-webkit-scrollbar { display: none; }
        .hour { min-width: 60px; background: rgba(255,255,255,0.1); border-radius: 16px; padding: 14px 10px; text-align: center; }
        .hour-time { font-size: 13px; opacity: 0.7; margin-bottom: 8px; }
        .hour-icon { font-size: 26px; }
        .hour-temp { font-size: 15px; margin-top: 5px; }
        
        /* Daily */
        .day-item { display: flex; align-items: center; background: rgba(255,255,255,0.1); border-radius: 14px; padding: 16px; margin-bottom: 8px; }
        .day-name { width: 90px; font-size: 16px; }
        .day-icon { font-size: 26px; }
        .day-high { margin-left: auto; font-size: 16px; font-weight: 500; padding: 0 15px; }
        .day-low { font-size: 16px; opacity: 0.5; }
        
        /* Details */
        .details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .detail { background: rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; }
        .detail-label { font-size: 13px; opacity: 0.6; margin-bottom: 8px; }
        .detail-value { font-size: 22px; font-weight: 500; }
        
        /* Update */
        .update { text-align: center; font-size: 12px; opacity: 0.4; margin-top: 20px; }
        
        /* Loading */
        .loading { text-align: center; padding: 50px; opacity: 0.5; }
        
        /* Error */
        .error { background: rgba(255,0,0,0.2); padding: 15px; border-radius: 12px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button>☰</button>
            <h1>Météo</h1>
            <button>⚙</button>
        </div>
        
        <div class="search">
            <input type="text" id="search" placeholder="Rechercher une ville..." onkeypress="search(event)">
        </div>
        
        <div class="loading" id="loading">Chargement...</div>
        <div class="error" id="error"></div>
        
        <div id="weather" style="display:none;">
            <div class="current">
                <div class="city" id="city">Paris</div>
                <div class="icon" id="icon">☀️</div>
                <div class="temp" id="temp">18°</div>
                <div class="desc" id="desc">Ciel dégagé</div>
                <div class="hl" id="hl">H:20° L:10°</div>
            </div>
            
            <div class="scroll-title">PRÉVISIONS HORAIRES</div>
            <div class="scroll" id="hourly"></div>
            
            <div class="scroll-title">10 JOURS</div>
            <div class="scroll" id="daily"></div>
            
            <div class="details">
                <div class="detail">
                    <div class="detail-label">💧 Humidité</div>
                    <div class="detail-value" id="humidity">65%</div>
                </div>
                <div class="detail">
                    <div class="detail-label">💨 Vent</div>
                    <div class="detail-value" id="wind">12km/h</div>
                </div>
                <div class="detail">
                    <div class="detail-label">☀️ UV</div>
                    <div class="detail-value" id="uv">3</div>
                </div>
                <div class="detail">
                    <div class="detail-label">🌡️ Ressenti</div>
                    <div class="detail-value" id="feels">17°</div>
                </div>
                <div class="detail">
                    <div class="detail-label">👁️ Visibilité</div>
                    <div class="detail-value" id="vis">10km</div>
                </div>
                <div class="detail">
                    <div class="detail-label">📊 Pression</div>
                    <div class="detail-value" id="pressure">1015hPa</div>
                </div>
            </div>
            
            <div class="update">Mise à jour: <span id="update">--:--</span></div>
        </div>
    </div>

    <script>
        const icons = {
            0: {d:'☀️',n:'🌙',t:'Ciel dégagé'},
            1: {d:'⛅',n:'☁️',t:'Partiellement nuageux'},
            2: {d:'⛅',n:'☁️',t:'Partiellement nuageux'},
            3: {d:'☁️',n:'☁️',t:'Nuageux'},
            45:{d:'🌫️',n:'🌫️',t:'Brouillard'},
            48:{d:'🌫️',n:'🌫️',t:'Brouillard givrant'},
            51:{d:'🌧️',n:'🌧️',t:'Bruine'},
            53:{d:'🌧️',n:'🌧️',t:'Bruine'},
            55:{d:'🌧️',n:'🌧️',t:'Bruine'},
            61:{d:'🌧️',n:'🌧️',t:'Pluie légère'},
            63:{d:'🌧️',n:'🌧️',t:'Pluie'},
            65:{d:'⛈️',n:'⛈️',t:'Pluie forte'},
            71:{d:'🌨️',n:'🌨️',t:'Neige légère'},
            73:{d:'❄️',n:'❄️',t:'Neige'},
            75:{d:'❄️',n:'❄️',t:'Neige abondante'},
            80:{d:'🌧️',n:'🌧️',t:'Averses'},
            81:{d:'🌧️',n:'🌧️',t:'Averses'},
            82:{d:'⛈️',n:'⛈️',t:'Averses fortes'},
            95:{d:'⛈️',n:'⛈️',t:'Orage'},
            96:{d:'⛈️',n:'⛈️',t:'Orage grêle'},
            99:{d:'⛈️',n:'⛈️',t:'Orage violent'}
        };
        
        function getIcon(code, isDay) {
            return icons[code]? (isDay? icons[code].d : icons[code].n) : '☀️';
        }
        
        let coords = {lat:48.8566, lon:2.3522};
        
        async function searchCity(q) {
            let r = await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=1&language=fr');
            let d = await r.json();
            if(d.results && d.results[0]) {
                coords = {lat:d.results[0].latitude, lon:d.results[0].longitude};
                return d.results[0].name + (d.results[0].country?', '+d.results[0].country:'');
            }
            return 'Paris';
        }
        
        async function fetchWeather(lat, lon) {
            let url = 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
                '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl,visibility,precipitation,cloud_cover'+
                '&hourly=temperature_2m,weather_code,is_day,precipitation_probability'+
                '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max'+
                '&forecast_days=3&timezone=auto&lang=fr';
            let r = await fetch(url);
            return await r.json();
        }
        
        function display(data, cityName) {
            if(!data) return;
            let c = data.current, d = data.daily, h = data.hourly;
            
            document.getElementById('city').textContent = cityName;
            document.getElementById('icon').textContent = getIcon(c.weather_code, c.is_day);
            document.getElementById('temp').textContent = Math.round(c.temperature_2m)+'°';
            document.getElementById('desc').textContent = icons[c.weather_code]?.t || 'Inconnu';
            document.getElementById('hl').textContent = 'H:'+Math.round(d.temperature_2m_max[0])+'° L:'+Math.round(d.temperature_2m_min[0])+'°';
            
            // Hourly
            let hourlyDiv = document.getElementById('hourly');
            hourlyDiv.innerHTML = '';
            let now = new Date().getHours();
            for(let i=0; i<24; i++) {
                let hIdx = now + i;
                let timeLabel = (now+i)%24 + 'h';
                let icon, temp;

                if(i === 0) {
                    timeLabel = 'Maint';
                    icon = getIcon(c.weather_code, c.is_day);
                    temp = Math.round(c.temperature_2m);
                } else {
                    icon = getIcon(h.weather_code[hIdx], h.is_day[hIdx]);
                    temp = Math.round(h.temperature_2m[hIdx]);
                }

                let hourHtml = '<div class="hour"><div class="hour-time">'+timeLabel+'</div><div class="hour-icon">'+icon+'</div><div class="hour-temp">'+temp+'°</div></div>';
                hourlyDiv.innerHTML += hourHtml;
            }
            
            // Daily
            let dailyDiv = document.getElementById('daily');
            dailyDiv.innerHTML = '';
            let days = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
            for(let i=0; i<7; i++) {
                let dayName = i===0?'Aujourd\'hui':(i===1?'Demain':days[new Date(Date.now()+i*86400000).getDay()]);
                dailyDiv.innerHTML += '<div class="day-item"><div class="day-name">'+dayName+'</div><div class="day-icon">'+getIcon(d.weather_code[i],1)+'</div><div class="day-high">'+Math.round(d.temperature_2m_max[i])+'°</div><div class="day-low">'+Math.round(d.temperature_2m_min[i])+'°</div></div>';
            }
            
            // Details
            document.getElementById('humidity').textContent = c.relative_humidity_2m+'%';
            document.getElementById('wind').textContent = Math.round(c.wind_speed_10m)+'km/h';
            document.getElementById('uv').textContent = Math.round(d.uv_index_max[0]);
            document.getElementById('feels').textContent = Math.round(c.apparent_temperature)+'°';
            document.getElementById('vis').textContent = (c.visibility/1000).toFixed(1)+'km';
            document.getElementById('pressure').textContent = Math.round(c.pressure_msl)+'hPa';
            document.getElementById('update').textContent = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('weather').style.display = 'block';
        }
        
        async function init(city) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('weather').style.display = 'none';
            
            let cityName = city || 'Paris';

            if (city) {
                cityName = await searchCity(city);
            } else if (navigator.geolocation) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {timeout: 10000});
                    });
                    coords = {lat: pos.coords.latitude, lon: pos.coords.longitude};
                    cityName = "Ma position";
                } catch (e) {
                    console.log("Geolocation failed:", e);
                }
            }
            
            let data = await fetchWeather(coords.lat, coords.lon);
            display(data, cityName);
        }
        
        function search(e) {
            if(e.key === 'Enter') init(e.target.value);
        }
        
        init();
    </script>
</body>
</html>
