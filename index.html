<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#050a14">
    <title>IA Vocal — Assistant</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{--bg:#050a14;--card:rgba(12,18,32,0.85);--accent:#00bfff;--accent2:#00ffaa;--text:#d0daf0;--dim:#556688;--danger:#ff4466}
        body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro','Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;-webkit-user-select:none;user-select:none}

        .page{display:none;position:fixed;inset:0;flex-direction:column;z-index:10}
        .page.on{display:flex}

        #welcome{background:radial-gradient(ellipse at 50% 40%,#0d1a30 0%,#050a14 70%);align-items:center;justify-content:center;gap:20px;padding:20px}
        .w-orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#00ddff,#0066cc 55%,#001a33 80%,transparent);box-shadow:0 0 50px #00aaff44,0 0 100px #0066cc22;animation:breathe 3s ease-in-out infinite}
        @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
        .w-title{font-size:26px;font-weight:700;letter-spacing:.5px;margin-top:8px}
        .w-sub{font-size:13px;color:var(--dim);text-align:center;line-height:1.6}
        .w-features{display:flex;gap:18px;font-size:11px;color:var(--dim);margin:12px 0 28px}
        .w-features span{display:flex;align-items:center;gap:4px}
        .w-btn{padding:18px 64px;border:none;border-radius:14px;background:linear-gradient(135deg,#0088ee,#0055aa);color:#fff;font-size:19px;font-weight:600;cursor:pointer;transition:all .15s;touch-action:manipulation;min-width:200px;min-height:56px}
        .w-btn:active{transform:scale(.95)}

        #active{background:#000}
        #cam{position:absolute;inset:0;object-fit:cover;width:100%;height:100%;opacity:.3;z-index:1}
        #cam.mirror{transform:scaleX(-1)}
        #cam.off{opacity:0}
        .dim{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(5,10,20,.85) 0%,rgba(5,10,20,.2) 35%,rgba(5,10,20,.5) 100%)}

        .top{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
        .top-left{display:flex;align-items:center;gap:8px}
        .top-right{display:flex;align-items:center;gap:6px}
        .dot{width:8px;height:8px;border-radius:50%;background:#333;transition:all .3s}
        .dot.on{background:#00ff88;box-shadow:0 0 6px #00ff88}
        .dot.rec{background:var(--danger);box-shadow:0 0 6px var(--danger);animation:blink 1s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
        .dot.talk{background:var(--accent2);box-shadow:0 0 6px var(--accent2)}
        .lbl{font-size:11px;color:var(--dim)}
        .btn-icon{background:none;border:none;color:var(--dim);font-size:22px;padding:6px 10px;line-height:1;cursor:pointer;touch-action:manipulation}
        .btn-icon:active{opacity:.5}

        .frame-dot{position:absolute;top:10px;right:10px;z-index:25;width:6px;height:6px;border-radius:50%;background:var(--accent2);opacity:0;transition:opacity .15s}
        .frame-dot.flash{opacity:1}

        #audio-status{position:absolute;top:36px;right:14px;z-index:35;font-size:10px;color:var(--dim);background:rgba(0,0,0,.5);padding:2px 8px;border-radius:8px;display:none}

        #orb-wrap{position:absolute;top:0;left:0;right:0;bottom:0;z-index:15;display:flex;align-items:center;justify-content:center;pointer-events:none}
        #orb{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--accent2),#007755 55%,transparent 70%);opacity:0;transition:all .4s;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent}
        #orb.idle{opacity:.7;animation:breathe 3s ease-in-out infinite}
        #orb.rec{opacity:1;animation:rec 1.2s ease-in-out infinite;box-shadow:0 0 40px #00ffaa44}
        @keyframes rec{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
        #orb.speaking{opacity:1;animation:speak 1.2s ease-in-out infinite;box-shadow:0 0 50px #00ffaa66}
        @keyframes speak{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
    </style>
</head>
<body>

<div id="welcome" class="page on">
    <div class="w-orb"></div>
    <div class="w-title">Assistant IA Vocal</div>
    <div class="w-sub">Je te réponds avec une vraie voix.<br>Pose-moi des questions, parle-moi.</div>
    <div class="w-features">
        <span>🗣️ Voix naturelle</span>
        <span>🧠 Mistral IA</span>
        <span>📷 Caméra optionnelle</span>
    </div>
    <button class="w-btn" id="go">▶ Parler</button>
    <a href="photomaton.html" style="color:var(--dim);font-size:11px;margin-top:12px;text-decoration:none">→ Photomaton ID</a>
</div>

<div id="active" class="page">
    <video id="cam" autoplay playsinline muted></video>
    <div class="dim"></div>
    <div class="frame-dot" id="fdot"></div>
    <div id="audio-status"></div>
    <div class="top">
        <div class="top-left">
            <div class="dot" id="dot"></div>
            <span class="lbl" id="lbl">En attente...</span>
        </div>
        <div class="top-right">
            <button class="btn-icon" id="btn-mode" title="Mode">🧑‍🏫</button>
            <button class="btn-icon" id="btn-cam" title="Caméra">📷</button>
            <button class="btn-icon" id="quit">✕</button>
        </div>
    </div>
    <div id="orb-wrap"><div id="orb"></div></div>
</div>

<canvas id="cv" style="display:none"></canvas>

<script>
(function(){
var $=function(id){return document.getElementById(id)};
var camEl=$('cam'),cv=$('cv'),ctx=cv.getContext('2d');
var dotEl=$('dot'),lblEl=$('lbl'),orbEl=$('orb'),fdotEl=$('fdot'),audioStatus=$('audio-status');
var stream=null,frameTimer=null,rec=null,active=false,speaking=false,cameraOn=true;
var history=[],latestFrame=null,waitingAI=false,facingMode='environment';
var lastAudioB64=null;
var currentMode=0; // 0=Assistant, 1=Professeur
var PROMPTS=[
    "Tu es un assistant IA. Reponds a toutes les questions, aide sur tous les sujets. Si la camera est active et que tu vois quelque chose, decris-le ou lis le texte visible. Si la camera est inactive, reponds normalement. N'invente jamais.",
    "Tu es un professeur particulier. Quand on te montre un exercice via la camera, regarde-le attentivement et explique-le etape par etape. Guide l'eleve sans donner la reponse directement. Si pas d'exercice visible, aide sur les devoirs en general. Sois patient et pedagogique."
];
var MODE_NAMES=['Assistant','Professeur'];
function getPrompt(){return PROMPTS[currentMode];}

/* ============ AUDIO ENGINE ============ */
var audioCtx=null;
var gainNode=null;
var activeSource=null;

function getAudioCtx(){
    if(!audioCtx){
        audioCtx=new(window.AudioContext||window.webkitAudioContext)();
        gainNode=audioCtx.createGain();
        gainNode.gain.value=1.2;
        gainNode.connect(audioCtx.destination);
    }
    if(audioCtx.state==='suspended')audioCtx.resume();
    return audioCtx;
}

function unlockAudio(){
    try{
        var ctx=getAudioCtx();
        var buf=ctx.createBuffer(1,1,22050);
        var src=ctx.createBufferSource();
        src.buffer=buf;src.connect(gainNode||ctx.destination);src.start(0);
    }catch(e){}
}

function stopAudio(){
    if(activeSource){
        try{activeSource.stop();activeSource.disconnect()}catch(e){}
        activeSource=null;
    }
}

function audioBufferFromB64(b64){
    var raw=atob(b64);
    var u8=new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++)u8[i]=raw.charCodeAt(i);
    return u8.buffer;
}

function playAudioFromB64(b64){
    lastAudioB64=b64;
    stopAudio();
    return new Promise(function(resolve){
        try{
            var ctx=getAudioCtx();
            ctx.decodeAudioData(audioBufferFromB64(b64)).then(function(audioBuf){
                var src=ctx.createBufferSource();
                src.buffer=audioBuf;
                src.connect(gainNode);
                activeSource=src;
                src.onended=function(){activeSource=null;resolve(true)};
                src.start(0);
            }).catch(function(){
                var blob=new Blob([new Uint8Array(audioBufferFromB64(b64))],{type:'audio/wav'});
                var url=URL.createObjectURL(blob);
                var el=new Audio(url);
                el.setAttribute('playsinline','');
                el.onended=function(){URL.revokeObjectURL(url);resolve(true)};
                el.onerror=function(){URL.revokeObjectURL(url);resolve(false)};
                el.play().catch(function(){URL.revokeObjectURL(url);resolve(false)});
            });
        }catch(e){
            resolve(false);
        }
    });
}

/* ============ UI ============ */
function show(id){
    var pages=document.querySelectorAll('.page');
    for(var i=0;i<pages.length;i++)pages[i].classList.remove('on');
    $(id).classList.add('on');
}
function stat(t,m){
    lblEl.textContent=t;dotEl.className='dot';
    if(m==='on')dotEl.classList.add('on');
    else if(m==='rec')dotEl.classList.add('rec');
    else if(m==='talk')dotEl.classList.add('talk');
}

/* ============ CAMERA ============ */
function stopCam(){
    if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
    if(frameTimer){clearInterval(frameTimer);frameTimer=null}
    camEl.classList.add('off');
}
function startCam(){
    if(!cameraOn)return Promise.resolve(false);
    return navigator.mediaDevices.getUserMedia({
        video:{facingMode:facingMode,width:{ideal:640},height:{ideal:480}},audio:false
    }).then(function(s){
        stream=s;camEl.srcObject=s;camEl.classList.remove('off');
        camEl.classList.toggle('mirror',facingMode==='user');
        frameTimer=setInterval(function(){
            if(!camEl.videoWidth)return;
            cv.width=320;cv.height=240;
            ctx.save();ctx.translate(cv.width,0);ctx.scale(-1,1);
            ctx.drawImage(camEl,0,0,320,240);ctx.restore();
            latestFrame=cv.toDataURL('image/jpeg',0.5).split(',')[1];
            fdotEl.classList.add('flash');setTimeout(function(){fdotEl.classList.remove('flash')},150);
        },3000);
        return true;
    }).catch(function(){return false});
}
function toggleCam(){
    cameraOn=!cameraOn;
    $('btn-cam').style.opacity=cameraOn?'1':'.4';
    if(cameraOn){
        startCam();
    }else{
        stopCam();
        latestFrame=null;
    }
}

/* ============ MIC ============ */
function startMic(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){stat('Non supporte','');return}
    rec=new SR();rec.continuous=true;rec.interimResults=false;rec.lang='fr-FR';
    rec.onresult=function(e){
        for(var i=e.resultIndex;i<e.results.length;i++){
            if(e.results[i].isFinal){
                var t=e.results[i][0].transcript.trim();
                if(t)onUserText(t);
            }
        }
    };
    rec.onend=function(){if(active)try{rec.start()}catch(e){}};
    rec.onerror=function(e){if(active&&e.error!=='no-speech'&&e.error!=='aborted')setTimeout(function(){try{rec.start()}catch(e){}},800)};
    try{rec.start();stat('En écoute','rec');orbEl.className='rec'}catch(e){}
}
function stopMic(){
    if(rec){rec.abort();rec=null}
    orbEl.className=active?'idle':'';
    $('mic')&&$('mic').classList.remove('on');
}
function toggleMic(){
    if(!active)return;
    if(rec){stopMic();stat('Pause','on')}
    else startMic();
}

/* ============ AI ============ */
var IS_LOCAL=location.hostname==='localhost'||location.hostname==='127.0.0.1';
var API_HOST=IS_LOCAL?'':'https://ia-proxy.tom16112008.workers.dev';
function getPrompt(){return PROMPTS[currentMode];}
function callMistralChat(messages){
    if(IS_LOCAL)return Promise.resolve(null);
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'pixtral-12b-2409',messages:messages,max_tokens:500,temperature:0.3})
    }).then(function(r){if(!r.ok)return r.json().then(function(e){throw new Error('Chat '+r.status+': '+(e.message||JSON.stringify(e)))});return r.json()})
      .then(function(d){return d.choices[0].message.content});
}

function callMistralTTS(text){
    if(IS_LOCAL)return Promise.resolve(null);
    return fetch(API_HOST+'/v1/audio/speech',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'voxtral-mini-tts-2603',input:text,voice_id:'c69964a6-ab8b-4f8a-9465-ec0925096ec8',response_format:'wav'})
    }).then(function(r){if(!r.ok)return'';return r.json()}).then(function(d){return d.audio_data||''});
}

function onUserText(text){
    if(!text||waitingAI)return;
    history.push({role:'user',content:text});
    if(history.length>30)history=history.slice(-20);
    waitingAI=true;
    stat('Réflexion...','on');
    if(rec){stopMic()}

    var promise;

    if(IS_LOCAL){
        promise=fetch('/api/ia',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({text:text,image:cameraOn?latestFrame:null,history:history.slice(-20)})
        }).then(function(r){if(!r.ok)throw new Error('Serveur '+r.status);return r.json()})
          .then(function(d){return{aiText:d.text,audioB64:d.audio_data||'',error:d.error}});
    }else{
        var msgs=[{role:'system',content:getPrompt()}].concat(history.slice(-20));
        var userContent=[{type:'text',text:text}];
        if(cameraOn&&latestFrame)userContent.unshift({type:'image_url',image_url:'data:image/jpeg;base64,'+latestFrame});
        msgs.push({role:'user',content:userContent});

        promise=callMistralChat(msgs).then(function(aiText){
            return callMistralTTS(aiText).then(function(audioB64){
                return{aiText:aiText,audioB64:audioB64};
            });
        });
    }

    promise.then(function(result){
        if(result.error)throw new Error(result.error);
        history.push({role:'assistant',content:result.aiText});
        if(result.audioB64){
            stat('Parle...','talk');speaking=true;orbEl.className='speaking';
            return playAudioFromB64(result.audioB64);
        }else{
            return false;
        }
    }).then(function(){
        speaking=false;orbEl.className='idle';
        if(active){startMic()}else{stat('Connecte','on')}
        waitingAI=false;
    }).catch(function(e){
        console.error('[IA] Error:',e);
        lblEl.textContent='Erreur: '+e.message;
        setTimeout(function(){if(active)startMic()},3000);
        speaking=false;orbEl.className='idle';
        waitingAI=false;
    });
}

/* ============ LIFECYCLE ============ */
function start(){
    show('active');stat('Demarrage...','on');active=true;
    unlockAudio();
    startCam().then(function(ok){
        if(!ok)cameraOn=false;
        orbEl.className='idle';stat('Connecte','on');startMic();
    }).catch(function(){
        orbEl.className='idle';stat('Connecte','on');startMic();
    });
}

function quit(){
    active=false;stopMic();stopCam();history=[];latestFrame=null;lastAudioB64=null;
    stopAudio();try{if(audioCtx)audioCtx.close();audioCtx=null;gainNode=null}catch(e){}
    orbEl.className='';show('welcome');stat('En attente...','');
}

function toggleMode(){
    currentMode=(currentMode+1)%PROMPTS.length;
    history=[];
    $('btn-mode').textContent=currentMode===0?'🧑‍🏫':'📚';
    showAudioStatus('Mode: '+MODE_NAMES[currentMode]);
}

/* ============ EVENTS ============ */
function bind(id,fn){
    var el=$(id);if(!el)return;
    el.addEventListener('click',function(e){e.preventDefault();fn()});
    el.addEventListener('touchend',function(e){e.preventDefault();fn()});
}
bind('go',start);
bind('quit',quit);
bind('btn-cam',toggleCam);
bind('btn-mode',toggleMode);
orbEl.addEventListener('click',toggleMic);
orbEl.addEventListener('touchend',function(e){e.preventDefault();toggleMic()});
})();
</script>
</body>
</html>
