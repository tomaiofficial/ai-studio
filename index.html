<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Astra">
<title>Astra — Assistant Vocal IA</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b14;--surface:#12102a;--surface-2:#18153a;--text:#f0f0f8;--text-dim:#9a9ab5;--accent:#7c5cff;--accent-2:#ff5ca8;--gold:#ffc107;--radius:20px;--shadow:0 20px 60px rgba(124,92,255,.18);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}

/* Fond aurora */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora::before{content:'';position:absolute;width:120vmax;height:120vmax;left:-30vmax;top:-30vmax;background:radial-gradient(circle,rgba(124,92,255,.35),transparent 60%);animation:drift1 20s ease-in-out infinite alternate;border-radius:50%}
.aurora::after{content:'';position:absolute;width:100vmax;height:100vmax;right:-20vmax;bottom:-20vmax;background:radial-gradient(circle,rgba(255,92,168,.25),transparent 60%);animation:drift2 25s ease-in-out infinite alternate;border-radius:50%}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(10vmax,8vmax) scale(1.1)}}
@keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(-8vmax,-6vmax) scale(1.15)}}

/* Rail gauche */
.rail{position:fixed;left:0;top:0;bottom:0;width:72px;display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:14px;background:rgba(18,16,42,.65);backdrop-filter:blur(20px) saturate(1.2);border-right:1px solid rgba(124,92,255,.12);z-index:20}
.rail-top{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7c5cff,#5a3fd6);box-shadow:0 0 20px rgba(124,92,255,.5);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.rail-btn{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(124,92,255,.15);color:#c8c8dd;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:all .2s ease;position:relative}
.rail-btn:hover{background:rgba(124,92,255,.25);color:#fff;border-color:rgba(124,92,255,.5);transform:translateY(-2px)}
.rail-btn::after{content:attr(title);position:absolute;left:56px;top:50%;transform:translateY(-50%);background:#171728;padding:6px 10px;border-radius:8px;font-size:11px;color:#fff;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.rail-btn:hover::after{opacity:1}

/* Header */
.header{position:fixed;top:0;left:72px;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(11,11,22,.7);backdrop-filter:blur(16px);border-bottom:1px solid rgba(124,92,255,.1);z-index:15;font-size:13px;color:#9a9ab5}
.header b{color:#fff;font-weight:600}
.header a{color:#fff;text-decoration:underline;text-underline-offset:3px}

/* Main */
.main{margin-left:72px;margin-top:56px;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;position:relative;z-index:1}

/* Status */
.status{font-family:'Playfair Display',serif;font-size:22px;color:#fff;text-align:center;margin-bottom:40px;letter-spacing:.5px;line-height:1.3;text-shadow:0 2px 30px rgba(124,92,255,.3)}
.status span{display:block;font-family:'Inter',sans-serif;font-size:14px;color:#9a9ab5;margin-top:8px;font-weight:300;letter-spacing:0}

/* Mic button */
.mic-btn{width:260px;height:260px;border-radius:50%;border:none;cursor:pointer;background:#0d0d10;position:relative;overflow:hidden;box-shadow:0 0 80px rgba(124,92,255,.35),0 0 160px rgba(255,92,168,.15),inset 0 0 60px rgba(124,92,255,.15);transition:transform .15s ease,box-shadow .3s ease}
.mic-btn:hover{transform:scale(1.03);box-shadow:0 0 100px rgba(124,92,255,.45),0 0 180px rgba(255,92,168,.2),inset 0 0 80px rgba(124,92,255,.2)}
.mic-btn:active{transform:scale(.95)}
.mic-btn::before{content:'';position:absolute;inset:-30%;background:conic-gradient(from 0deg,#7c5cff,#ff5ca8,#ff9f2e,#3cdca0,#4da3ff,#7c5cff);animation:vortexSpin 7s linear infinite;filter:saturate(1.3)}
.mic-btn::after{content:'';position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 35% 28%,#23233c 0%,#0d0d10 70%);box-shadow:inset 0 0 40px rgba(124,92,255,.3)}
@keyframes vortexSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.orb-icon{position:relative;z-index:2;font-size:48px;filter:drop-shadow(0 0 12px rgba(255,255,255,.7));pointer-events:none}

/* Input */
.input-row{display:flex;align-items:center;gap:12px;margin-top:40px;width:min(92vw,480px);background:rgba(255,255,255,.05);border:1px solid rgba(124,92,255,.2);border-radius:50px;padding:6px 6px 6px 18px;backdrop-filter:blur(8px);transition:border-color .2s}
.input-row:focus-within{border-color:rgba(124,92,255,.5);box-shadow:0 0 20px rgba(124,92,255,.15)}
.input-row input{flex:1;background:transparent;border:none;color:#fff;font-size:15px;outline:none;font-family:inherit}
.input-row input::placeholder{color:#7a7a9a}
.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#7c5cff,#5a3fd6);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 15px rgba(124,92,255,.4);transition:transform .15s,box-shadow .2s}
.send-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,92,255,.5)}

/* Version */
.version{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;color:#5a5a75;z-index:10;letter-spacing:.3px}
</style>
</head>
<body>
<div class="aurora"></div>

<!-- Rail -->
<nav class="rail" aria-label="Navigation">
  <a href="#" class="rail-top" aria-label="Astra">💜</a>
  <a href="#" class="rail-btn" title="Réglages" aria-label="Réglages">⚙️</a>
  <a href="#" class="rail-btn" title="Historique" aria-label="Historique">📜</a>
  <a href="#" class="rail-btn" title="À propos d'Astra" aria-label="À propos d'Astra">💡</a>
</nav>

<!-- Header -->
<header class="header">
  <div><b>Astra</b> — assistante vocale par <b>Tom AI</b> · <a href="https://www.tiktok.com/@tom.ai.official" target="_blank" rel="noopener noreferrer">@tom.ai.official</a></div>
  <div>v11.33</div>
</header>

<main class="main">
  <div class="status">Appuie sur le micro et parle <span>Mode vocal — 100% gratuit, sans compte</span></div>
  <button class="mic-btn" aria-label="Parler" onclick="this.classList.toggle('listening')">
    <span class="orb-icon">🎙️</span>
  </button>
  <div class="input-row">
    <input type="text" placeholder="Écris ta question ici…" aria-label="Question">
    <button class="send-btn" aria-label="Envoyer">➤</button>
  </div>
  <div style="margin-top:12px;font-size:12px;color:#9a9ab5;text-align:center">
    <b>Voix IA :</b> Inworld TTS-2 · Google Translate · <b style="color:#7c5cff">Supertonic IA</b> (10 voix, 6 langues, local)
  </div>
</main>

<div class="version">Assistant Vocal IA — v11.33 · Créé par Tom AI</div>
</body>
</html>
