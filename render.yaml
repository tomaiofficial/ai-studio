services:
  - type: web
    name: astra-vocal-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ASTRA_API_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://tomaiofficial.github.io
      - key: PUBLIC_SUGGESTIONS
        value: "true"
