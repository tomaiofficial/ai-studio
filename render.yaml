services:
  - type: web
    name: astra-vocal-server
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ASTRA_API_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://tomaiofficial.github.io
      - key: PUBLIC_SUGGESTIONS
        value: "true"
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: AUTONOMY_ENABLED
        value: "true"
      - key: AUTONOMY_INTERVAL_HOURS
        value: "12"
      - key: AUTONOMY_START_DELAY_MINUTES
        value: "5"
      - key: AUTONOMY_REPOSITORY
        value: tomaiofficial/ai-studio
      - key: AUTONOMY_WORKFLOW
        value: astra-autonomous-proposals.yml
      - key: AUTONOMY_GITHUB_TOKEN
        sync: false
