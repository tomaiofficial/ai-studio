name: Fix await + verif (one-shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix + verification
        run: |
          git config user.name "tomai-bot"
          git config user.email "actions@users.noreply.github.com"
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py 2>&1 | tee astra-fix.txt
          node --check app.js && echo "SYNTAXE FINALE OK" >> astra-fix.txt || echo "SYNTAXE FINALE KO" >> astra-fix.txt
          git add app.js astra-fix.txt
          git commit -m "v10.29 : FIX SyntaxError — await speak(lesson) retire (await hors fonction async, cassait le parse de app.js et rendait les return illegaux) [skip ci]"
          git rm -f .github/workflows/fix-await.yml
          git commit -m "chore: supp workflow [skip ci]"
          git pull --rebase origin main || true
          git push
