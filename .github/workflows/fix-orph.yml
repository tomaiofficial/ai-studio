name: Fix orphelin (one-shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Suppression bloc orphelin
        run: |
          git config user.name "tomai-bot"
          git config user.email "actions@users.noreply.github.com"
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
          git add app.js astra-fix4.txt
          git commit -m "v10.32 : FIX definitif SyntaxError/Illegal return — bloc orphelin (corps de if supprime + accolade fermante en trop) retire, il refermait handleQuestion trop tot ; + fix text->question [skip ci]"
          git rm -f .github/workflows/fix-orph.yml
          git commit -m "chore: supp workflow [skip ci]"
          git pull --rebase origin main || true
          git push
