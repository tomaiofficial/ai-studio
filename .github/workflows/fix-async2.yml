name: Fix async v2 (one-shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revert + async v2
        run: |
          git config user.name "tomai-bot"
          git config user.email "actions@users.noreply.github.com"
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
          git add app.js astra-fix3.txt
          git commit -m "v10.31 : FIX v2 — revert mauvais async, asyncisation de la vraie fonction englobante [skip ci]"
          git rm -f .github/workflows/fix-async2.yml
          git commit -m "chore: supp workflow [skip ci]"
          git pull --rebase origin main || true
          git push
