name: 📬 Newsletter IA DÉRAPE

on:
  push:
    branches: [main]
    paths:
      - 'news.json'          # se déclenche quand tu publies une actu
  schedule:
    - cron: '0 9 * * *'      # ou tous les jours à 9h UTC
  workflow_dispatch:          # ou manuellement depuis l'onglet Actions
    inputs:
      news_id:
        description: "Forcer l'envoi d'une actu (id, ex: n5)"
        required: false
      dry_run:
        description: "Test sans envoyer (true/false)"
        required: false
        default: 'false'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📤 Envoyer la newsletter
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM:            ${{ secrets.MAIL_FROM }}
          SITE_URL:             https://tomaiofficial.github.io/ai-studio/
          FORCE_NEWS_ID:        ${{ github.event.inputs.news_id }}
          DRY_RUN:              ${{ github.event.inputs.dry_run }}
        run: node scripts/send-newsletter.mjs
