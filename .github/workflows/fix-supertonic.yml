name: Fix Supertonic HD (one-shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write patch script
        run: |
          echo '' | base64 -d > /tmp/fix.py
      - name: Apply patch
        run: python3 /tmp/fix.py
      - name: Validate JS
        run: |
          node --check app.js || (echo "SYNTAX ERROR" && exit 1)
      - name: Commit and cleanup
        run: |
          git config user.name "tomai-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f astra-voices-scan.txt 2>/dev/null || true
          git rm -f .github/workflows/fix-supertonic.yml
          git add app.js index.html version.json 2>/dev/null || git add app.js index.html
          git commit -m "v11.36: voix Supertonic HD réellement fonctionnelles (module Supertone complet + clé Réglages) [skip ci]"
          git push
