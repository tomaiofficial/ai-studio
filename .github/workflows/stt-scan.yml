name: Scan STT mobile (one-shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  scan:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan STT
        run: |
          git config user.name "tomai-bot"
          git config user.email "actions@users.noreply.github.com"
          {
            echo "=== MESSAGE RIEN ENTENDU ==="
            grep -n "rien entendu|rapproche" app.js
            echo ""
            echo "=== CLASSE SpeechToTextHandler (lignes 1-125) ==="
            sed -n '1,125p' app.js
            echo ""
            echo "=== ZONE startRecorder ==="
            grep -n "startRecorder|stopRecorder|recognition.start|recog.start|w.start|.listen" app.js | head -30
            echo ""
            echo "=== ZONE around rien entendu (200 lignes autour) ==="
            L=$(grep -n "rien entendu" app.js | head -1 | cut -d: -f1)
            if [ -n "$L" ]; then sed -n "$((L-80)),$((L+120))p" app.js; fi
          } > astra-stt-scan.txt
          git add astra-stt-scan.txt
          git commit -m "chore: scan STT mobile [skip ci]"
          git rm -f .github/workflows/stt-scan.yml
          git commit -m "chore: suppression workflow scan [skip ci]"
          git push
