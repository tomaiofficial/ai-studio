name: Retrait polylogue v2 (one-shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-polylogue:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retire tout le polylogue (fonction + commande + references)
        run: |
          set -x
          git config user.name "tomai-bot"
          git config user.email "actions@users.noreply.github.com"
          cat > /tmp/rm.py <<'PYEOF'
          import re, sys
          src = open('app.js', encoding='utf-8').read()
          if 'astraPolylogue' not in src:
              print('DEJA RETIRE'); sys.exit(0)
          m = re.search(r'/\* ---- 2\).*?(?=/\* ---- 3\))', src, re.S)
          if not m:
              print('BLOC INTROUVABLE'); sys.exit(1)
          src = src[:m.start()] + src[m.end():]
          lines = src.split('\n'); out = []; i = 0
          while i < len(lines):
              l = lines[i]
              if 'polylogue' in l.lower() and 'test(q)' in l:
                  depth = 0; started = False
                  while i < len(lines):
                      depth += lines[i].count('{') - lines[i].count('}')
                      started = True; i += 1
                      if started and depth <= 0: break
                  continue
              if 'polylogue' in l.lower():
                  i += 1; continue
              out.append(l); i += 1
          src = '\n'.join(out)
          open('app.js', 'w', encoding='utf-8').write(src)
          n = src.lower().count('polylogue')
          ok_conseil = 'astraConseil' in src
          print('OCCURRENCES POLYLOGUE:', n, '| CONSEIL CONSERVE:', ok_conseil)
          if n > 0 or not ok_conseil:
              sys.exit(1)
          print('OK')
          PYEOF
          python3 /tmp/rm.py
          git add app.js
          git commit -m "v10.4 : retrait du polylogue — reste le conseil d'IA (3 IA + synthese) et le passe-relais autonome [skip ci]"
          git rm -f .github/workflows/rm-polylogue.yml
          git commit -m "chore: suppression du workflow ponctuel rm-polylogue [skip ci]"
          git pull --rebase origin main || true
          git push
