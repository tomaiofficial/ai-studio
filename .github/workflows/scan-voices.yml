name: Scan voices state (one-shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  scan:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan
        run: |
          git config user.name "tomai-bot"
          git config user.email "actions@users.noreply.github.com"
          {
            echo "=== APP_VERSION ==="
            grep -n "APP_VERSION" app.js | head -5
            echo "=== supertonic dans app.js ==="
            grep -n -i "supertonic" app.js | head -60
            echo "=== gemini dans app.js ==="
            grep -n -i "gemini" app.js | head -40
            echo "=== speak / voiceMode / populate ==="
            grep -n "voiceMode\|populateVoices\|populateSystemVoices\|speakGoogle\|speakVoxtral\|speak(\|function speak" app.js | head -80
            echo "=== tts select dans index.html ==="
            grep -n -i "ttsVoice\|testVoice\|mistralKey\|supertonic\|gemini\|clé\|cle " index.html | head -80
            echo "=== tail app.js (300 dernieres lignes) ==="
            tail -300 app.js
          } > astra-voices-scan.txt
          git add astra-voices-scan.txt
          git commit -m "chore: scan voix supertonic [skip ci]"
          git rm -f .github/workflows/scan-voices.yml
          git commit -m "chore: supp workflow [skip ci]"
          git push
