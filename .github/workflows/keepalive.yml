name: Keep Alive (Render)

# ════════════════════════════════════════════════════════
# Gardien d'éveil : évite le spin-down de l'instance Render
# (plan Free : mise en veille après ~15 min sans trafic).
#
# Ping toutes les 5 min sur https://agnes-ia.onrender.com/ :
# toute requête HTTP entrante compte comme activité pour Render,
# donc l'instance ne se met plus jamais en veille et le serveur
# ne « redémarre » plus tout seul.
#
# Gratuit : tourne sur GitHub Actions (aucun compte tiers requis).
# ════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render instance (réveille + maintient éveillé)
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://agnes-ia.onrender.com/ --max-time 90
