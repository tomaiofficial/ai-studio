name: Fix async fct (one-shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Asynciser les fonctions avec await illegaux
        run: |
          git config user.name "tomai-bot"
          git config user.email "actions@users.noreply.github.com"
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
          git add app.js astra-fix2.txt
          git commit -m "v10.30 : FIX SyntaxError — fonctions englobantes asyncisees (await requestFeatureProposal et speak hors fonction async) [skip ci]"
          git rm -f .github/workflows/fix-async.yml
          git commit -m "chore: supp workflow [skip ci]"
          git pull --rebase origin main || true
          git push
