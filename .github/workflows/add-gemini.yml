name: Add Gemini TTS (one-shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajout Gemini TTS
        run: |
          git config user.name "tomai-bot"
          git config user.email "actions@users.noreply.github.com"
          echo '' | base64 -d > /tmp/add.py
          python3 /tmp/add.py
          node --check app.js && echo "SYNTAXE OK" || { echo "SYNTAXE KO"; exit 1; }
          git add app.js index.html astra-gemini-log.txt
          git commit -m "v10.33 : Voix Google via Gemini TTS — cle API Gemini dans Reglages, 6 voix (Puck, Charon, Kore, Leda, Orus, Zephyr) listees avec les autres voix [skip ci]"
          git rm -f .github/workflows/add-gemini.yml
          git rm -f astra-voices-scan.txt || true
          git commit -m "chore: supp workflow + scan [skip ci]"
          git pull --rebase origin main || true
          git push
