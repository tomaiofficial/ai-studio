name: Scan b64 (one-shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  scan:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan python base64
        run: |
          git config user.name "tomai-bot"
          git config user.email "actions@users.noreply.github.com"
          echo '' | base64 -d > /tmp/scan.py
          python3 /tmp/scan.py
          git add astra-check.txt
          git commit -m "chore: resultat scan [skip ci]"
          git rm -f .github/workflows/scan-b64.yml
          git commit -m "chore: supp workflow [skip ci]"
          git push
