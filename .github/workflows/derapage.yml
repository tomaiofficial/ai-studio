name: Astra derapage (one-shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-derapage:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch derapage (v2, regex + logs)
        run: |
          set -x
          git config user.name "tomai-bot"
          git config user.email "actions@users.noreply.github.com"
          echo "--- marqueur ---"
          grep -n "Math.random() < 0.15" app.js || echo "MARQUEUR ABSENT"
          cat > /tmp/patch.py <<'PYEOF'
          import re, sys
          src = open('app.js', encoding='utf-8').read()
          pat = re.compile(r'if \(Math\.random\(\) < 0\.15\) currentMood = pool\[Math\.floor\(Math\.random\(\) \* pool\.length\)\];')
          n = len(pat.findall(src))
          print('occurrences:', n)
          if n != 1:
              print('ECHEC: marqueur introuvable ou multiple')
              sys.exit(1)
          new = (
            'if (Math.random() < 0.18) {'
            '\n        /* v10.1 : DERAPAGE - des fois, sans raison, Astra pete un cable :'
            '\n           1 tirage sur 3 pioche une humeur corrosive (violente, vulgaire,'
            '\n           sarcastique, agacee, taquine) au lieu du pool sympathique. */'
            '\n        if (Math.random() < 0.33) {'
            "\n          currentMood = ['violente', 'vulgaire', 'sarcastique', 'agacee', 'taquine'][Math.floor(Math.random() * 5)];"
            '\n        } else {'
            '\n          currentMood = pool[Math.floor(Math.random() * pool.length)];'
            '\n        }'
            '\n      }'
          )
          open('app.js', 'w', encoding='utf-8').write(pat.sub(new, src))
          print('PATCH OK')
          PYEOF
          python3 /tmp/patch.py
          git add app.js
          git commit -m "v10.1 : Astra peut deraper - 6% par question, humeurs corrosives tirees au sort sans provocation [skip ci]"
          git pull --rebase origin main || true
          git rm -f .github/workflows/derapage.yml
          git commit -m "chore: suppression du workflow ponctuel derapage [skip ci]"
          git push
