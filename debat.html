<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎙️ Salle de débat IA — non-stop</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:#0a0a16;color:#e8e8f0;min-height:100vh;
    display:flex;flex-direction:column;
  }
  /* fond anime */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#0a0a16}
  .bg-aurora{position:absolute;border-radius:50%;filter:blur(90px);opacity:.25}
  .a1{width:500px;height:500px;background:#7c5cff;top:-150px;left:-100px;animation:drift 18s ease-in-out infinite alternate}
  .a2{width:450px;height:450px;background:#3cdca0;bottom:-150px;right:-100px;animation:drift 22s ease-in-out infinite alternate-reverse}
  .a3{width:350px;height:350px;background:#ff9f2e;top:40%;left:60%;animation:drift 26s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,40px) scale(1.15)}}

  header{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    padding:14px 18px;background:rgba(16,16,30,.85);backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(124,92,255,.25);
  }
  header h1{font-size:17px;font-weight:800;color:#fff}
  header h1 span{color:#3cdca0}
  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{
    background:linear-gradient(135deg,#7c5cff,#5a3fd6);color:#fff;border:none;
    padding:9px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;
    transition:transform .1s ease;
  }
  .btn:active{transform:scale(.95)}
  .btn.stop{background:linear-gradient(135deg,#ff5c5c,#d63f3f)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.ghost{background:rgba(255,255,255,.08);color:#c8c8dd;text-decoration:none;font-weight:600}
  select{
    background:#1c1c33;color:#e8e8f0;border:1px solid #2a2a45;border-radius:10px;
    padding:8px 10px;font-size:13px;outline:none;
  }
  .notice{
    padding:8px 14px;font-size:12px;color:#ffd27c;background:rgba(255,159,46,.1);
    border-bottom:1px solid rgba(255,159,46,.2);display:none;
  }
  .statusbar{
    padding:8px 18px;font-size:13px;font-weight:700;color:#3cdca0;
    background:rgba(60,220,160,.08);border-bottom:1px solid rgba(60,220,160,.15);
  }

  .stage{
    flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:14px;padding:18px;align-content:start;
  }
  .card{
    background:rgba(16,16,30,.9);border:1px solid rgba(255,255,255,.08);border-radius:16px;
    padding:14px;display:flex;flex-direction:column;gap:8px;min-height:150px;
    transition:border-color .2s, box-shadow .2s;
  }
  .card.speaking{border-color:var(--dc);box-shadow:0 0 20px rgba(60,220,160,.25)}
  .card.thinking{opacity:.75}
  .card-head{display:flex;align-items:center;gap:10px}
  .avatar{
    width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:rgba(255,255,255,.08);border:2px solid var(--dc);flex-shrink:0;
  }
  .card-name{font-weight:800;font-size:15px;color:var(--dc)}
  .card-voice{font-size:11px;color:#8a8aa5}
  .card-status{font-size:11px;color:#8a8aa5;font-weight:600}
  .card-msg{
    font-size:13px;line-height:1.5;color:#e8e8f0;white-space:pre-wrap;word-break:break-word;
    background:rgba(255,255,255,.04);border-radius:10px;padding:10px;flex:1;
    max-height:130px;overflow-y:auto;
  }
  .card-msg.empty{color:#5a5a7a;font-style:italic}
  .card-count{font-size:11px;color:#5a5a7a;text-align:right}

  .transcript-wrap{
    border-top:1px solid rgba(124,92,255,.2);background:rgba(16,16,30,.85);
    display:flex;flex-direction:column;max-height:34vh;
  }
  .transcript-title{
    padding:8px 16px;font-size:12px;font-weight:700;color:#9a9ab5;
    border-bottom:1px solid rgba(124,92,255,.12);
  }
  #transcript{flex:1;overflow-y:auto;padding:10px 16px;font-size:13px;line-height:1.6}
  .t-line{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.05)}
  .t-name{font-weight:700;flex-shrink:0;min-width:70px}
  .t-text{color:#c8c8dd;word-break:break-word}
  .t-mem{color:#ffd27c;font-style:italic;font-size:12px}

  @media (max-width:640px){
    .stage{grid-template-columns:1fr 1fr;padding:10px;gap:10px}
    .card{min-height:120px;padding:10px}
    .card-msg{max-height:90px}
    header h1{font-size:14px}
  }
</style>
</head>
<body>
<div class="bg">
  <div class="bg-aurora a1"></div>
  <div class="bg-aurora a2"></div>
  <div class="bg-aurora a3"></div>
</div>

<header>
  <h1>🎙️ Salle de débat <span>IA</span> — non-stop</h1>
  <div class="controls">
    <button class="btn" id="startBtn">▶ Lancer le débat</button>
    <button class="btn stop" id="stopBtn" disabled>⏹ Arrêter</button>
    <button class="btn ghost" id="muteBtn">🔊 Son actif</button>
    <select id="speedSel" title="Vitesse du débat">
      <option value="300">⚡ Rapide</option>
      <option value="800" selected>Normal</option>
      <option value="2000">🐢 Lent</option>
    </select>
    <a class="btn ghost" href="index.html">← Retour à Astra</a>
  </div>
</header>

<div class="notice" id="notice"></div>
<div class="statusbar" id="statusBar">⚪ Débat arrêté — clique sur ▶ Lancer</div>

<div class="stage" id="stage"></div>

<div class="transcript-wrap">
  <div class="transcript-title">📜 Journal du débat — les IA se souviennent de tout et s'améliorent</div>
  <div id="transcript"></div>
</div>

<script src="debat-engine.js?v=10.8"></script>
<script src="debat.js?v=10.8"></script>
</body>
</html>
