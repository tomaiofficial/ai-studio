<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orage — Apple Weather</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  #scene { position: relative; width: 100%; height: 100vh; font-family: -apple-system, 'SF Pro Display', sans-serif; }

  #sky-base {
    position: absolute; inset: 0;
    background: linear-gradient(180deg,
      #111827 0%,
      #1C2A3A 20%,
      #243245 40%,
      #2E3E55 60%,
      #3A4A60 78%,
      #2A3850 100%
    );
  }

  .cloud {
    position: absolute;
    border-radius: 50%;
    filter: blur(32px);
  }
  #c1 { width: 700px; height: 260px; top: -60px; left: -80px; background: rgba(45,55,80,0.85); animation: cd1 60s ease-in-out infinite alternate; }
  #c2 { width: 600px; height: 220px; top: -30px; right: -60px; background: rgba(38,48,72,0.9);  animation: cd2 45s ease-in-out infinite alternate; }
  #c3 { width: 800px; height: 280px; top: 60px;  left: 15%;  background: rgba(30,40,65,0.75); animation: cd3 70s ease-in-out infinite alternate; }
  #c4 { width: 500px; height: 180px; top: 100px; right: 10%; background: rgba(50,60,85,0.7);  animation: cd1 50s ease-in-out infinite alternate-reverse; }
  #c5 { width: 650px; height: 200px; top: 140px; left: 30%;  background: rgba(25,35,58,0.8);  animation: cd2 55s ease-in-out infinite alternate-reverse; }

  #rain-canvas, #bolt-canvas, #glow-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
  }

  #mist {
    position: absolute; bottom: 0; left: 0; right: 0; height: 40%;
    background: linear-gradient(180deg, transparent 0%, rgba(50,65,90,0.15) 40%, rgba(35,50,75,0.4) 100%);
  }

  #ui-card {
    position: absolute; bottom: 8vh; left: 50%; transform: translateX(-50%);
    width: 196px; text-align: center; color: white;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border: 0.5px solid rgba(255,255,255,0.2);
    border-radius: 22px; padding: 18px 22px;
  }
  .city  { font-size: 15px; font-weight: 400; opacity: 0.7; }
  .temp  { font-size: 60px; font-weight: 200; line-height: 1.05; margin: 2px 0; }
  .cond  { font-size: 13px; opacity: 0.65; font-weight: 300; }
  .info  { margin-top: 10px; padding-top: 10px; border-top: 0.5px solid rgba(255,255,255,0.15); display: flex; justify-content: space-between; font-size: 12px; opacity: 0.55; }

  @keyframes cd1 { from { transform: translateX(-18px) translateY(4px); } to { transform: translateX(22px) translateY(-4px); } }
  @keyframes cd2 { from { transform: translateX(12px) translateY(-6px); } to { transform: translateX(-20px) translateY(6px); } }
  @keyframes cd3 { from { transform: translateX(-8px) translateY(2px); }  to { transform: translateX(16px) translateY(-2px); } }
</style>
</head>
<body>
<div id="scene">
  <div id="sky-base"></div>
  <div class="cloud" id="c1"></div>
  <div class="cloud" id="c2"></div>
  <div class="cloud" id="c3"></div>
  <div class="cloud" id="c4"></div>
  <div class="cloud" id="c5"></div>
  <canvas id="glow-canvas"></canvas>
  <canvas id="rain-canvas"></canvas>
  <canvas id="bolt-canvas"></canvas>
  <div id="mist"></div>
  <div id="ui-card">
    <div class="city">Paris</div>
    <div class="temp">14°</div>
    <div class="cond">Orage</div>
    <div class="info">
      <span>💧 78%</span>
      <span>💨 22 km/h</span>
      <span>🌡 13°</span>
    </div>
  </div>
</div>

<script>
const rainCv  = document.getElementById('rain-canvas');
const boltCv  = document.getElementById('bolt-canvas');
const glowCv  = document.getElementById('glow-canvas');
const rCtx = rainCv.getContext('2d');
const bCtx = boltCv.getContext('2d');
const gCtx = glowCv.getContext('2d');

let W, H;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  [rainCv, boltCv, glowCv].forEach(c => { c.width = W; c.height = H; });
}
resize();
window.addEventListener('resize', () => { resize(); initRain(); });

// ── Rain ──────────────────────────────────────────────────────
const N = 280;
let drops = [];

function makeDrop(randomY) {
  const depth = Math.random();
  return {
    x: Math.random() * W,
    y: randomY ? Math.random() * H : -10,
    len: 10 + depth * 22,
    spd: 9 + depth * 14,
    tilt: 0.15 + Math.random() * 0.08,
    op: 0.18 + depth * 0.38,
    w: 0.5 + depth * 0.7,
    splash: false, sx: 0, sy: 0, sr: 0, sa: 0,
  };
}

function initRain() { drops = Array.from({ length: N }, () => makeDrop(true)); }
initRain();

function stepRain() {
  rCtx.clearRect(0, 0, W, H);
  drops.forEach(d => {
    d.x += Math.sin(d.tilt) * d.spd * 0.5;
    d.y += Math.cos(d.tilt) * d.spd;

    if (d.y - d.len > H || d.x > W + 20) {
      Object.assign(d, makeDrop(false)); d.x = Math.random() * (W + 30) - 15;
    }

    const x2 = d.x - Math.sin(d.tilt) * d.len;
    const y2 = d.y - Math.cos(d.tilt) * d.len;
    const g = rCtx.createLinearGradient(x2, y2, d.x, d.y);
    g.addColorStop(0, `rgba(150,175,215,0)`);
    g.addColorStop(1, `rgba(170,200,235,${d.op})`);
    rCtx.save();
    rCtx.strokeStyle = g; rCtx.lineWidth = d.w; rCtx.lineCap = 'round';
    rCtx.beginPath(); rCtx.moveTo(x2, y2); rCtx.lineTo(d.x, d.y); rCtx.stroke();
    rCtx.restore();

    if (d.y >= H - 8 && !d.splash) { d.splash = true; d.sx = d.x; d.sy = H - 4; d.sr = 0; d.sa = 0.5; }
    if (d.splash) {
      d.sr += 0.9; d.sa -= 0.055;
      if (d.sa > 0) {
        rCtx.save();
        rCtx.strokeStyle = `rgba(155,185,225,${d.sa})`;
        rCtx.lineWidth = 0.5;
        rCtx.beginPath();
        rCtx.ellipse(d.sx, d.sy, d.sr * 1.6, d.sr * 0.45, 0, 0, Math.PI * 2);
        rCtx.stroke();
        rCtx.restore();
      } else { d.splash = false; }
    }
  });
}

// ── Lightning ─────────────────────────────────────────────────
let nextFlash = Date.now() + 2000 + Math.random() * 5000;
let flashState = null; // { bolts, start, bgPeak }

function fractal(ax, ay, bx, by, rough, depth) {
  if (depth === 0) return [[ax, ay], [bx, by]];
  const mx = (ax + bx) / 2 + (Math.random() - 0.5) * rough;
  const my = (ay + by) / 2 + (Math.random() - 0.5) * rough * 0.35;
  return [...fractal(ax, ay, mx, my, rough * 0.6, depth - 1),
          ...fractal(mx, my, bx, by, rough * 0.6, depth - 1)];
}

function newBolt() {
  const sx = W * (0.25 + Math.random() * 0.5);
  const ey = H * (0.35 + Math.random() * 0.4);
  const ex = sx + (Math.random() - 0.5) * 150;
  const pts = fractal(sx, 0, ex, ey, 140, 7);
  const branches = Array.from({ length: 2 + Math.floor(Math.random() * 2) }, () => {
    const i = Math.floor(pts.length * (0.2 + Math.random() * 0.5));
    const p = pts[i];
    return { pts: fractal(p[0], p[1], p[0] + (Math.random()-0.5)*90, p[1]+50+Math.random()*100, 60, 5), a: 0.25+Math.random()*0.35 };
  });
  return { sx, pts, branches };
}

function triggerFlash() {
  const count = Math.random() < 0.3 ? 2 : 1;
  const bolts = Array.from({ length: count }, (_, i) => ({ bolt: newBolt(), delay: i * (60 + Math.random() * 90) }));
  flashState = { bolts, start: Date.now(), bgAlpha: 0 };
  nextFlash = Date.now() + 3500 + Math.random() * 9000;
}

function drawBolt(ctx, pts, alpha, w) {
  if (pts.length < 2) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowBlur = 22; ctx.shadowColor = `rgba(180,210,255,0.85)`;
  ctx.strokeStyle = `rgba(190,215,255,${alpha})`;
  ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  pts.forEach(p => ctx.lineTo(p[0], p[1]));
  ctx.stroke();
  ctx.shadowBlur = 4;
  ctx.strokeStyle = `rgba(235,245,255,${alpha * 0.85})`;
  ctx.lineWidth = w * 0.28;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  pts.forEach(p => ctx.lineTo(p[0], p[1]));
  ctx.stroke();
  ctx.restore();
}

function stepLightning() {
  gCtx.clearRect(0, 0, W, H);
  bCtx.clearRect(0, 0, W, H);

  if (!flashState) {
    if (Date.now() > nextFlash) triggerFlash();
    return;
  }

  const elapsed = Date.now() - flashState.start;
  let anyVisible = false;

  flashState.bolts.forEach(({ bolt, delay }) => {
    const lt = elapsed - delay;
    if (lt < 0) return;

    let ba = 0;
    if (lt < 30)       ba = lt / 30;
    else if (lt < 90)  ba = 1.0;
    else if (lt < 180) ba = 1 - (lt - 90) / 90;

    if (ba < 0.01) return;
    anyVisible = true;

    const bgA = ba * 0.3;
    const rg = gCtx.createRadialGradient(bolt.sx, 0, 0, bolt.sx, H * 0.4, H * 0.65);
    rg.addColorStop(0, `rgba(160,190,255,${bgA * 0.9})`);
    rg.addColorStop(0.5, `rgba(100,140,220,${bgA * 0.4})`);
    rg.addColorStop(1, `rgba(50,80,180,0)`);
    gCtx.fillStyle = rg; gCtx.fillRect(0, 0, W, H);

    drawBolt(bCtx, bolt.pts, ba, 2.8);
    bolt.branches.forEach(b => drawBolt(bCtx, b.pts, ba * b.a, 1.2));
  });

  const last = flashState.bolts[flashState.bolts.length - 1];
  if (elapsed > last.delay + 200) flashState = null;
}

// ── Loop ──────────────────────────────────────────────────────
function loop() {
  stepRain();
  stepLightning();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
