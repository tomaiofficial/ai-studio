<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#050a14">
    <title>IA App</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{--bg:#050a14;--card:rgba(12,18,32,0.85);--accent:#00bfff;--accent2:#00ffaa;--text:#d0daf0;--dim:#556688;--danger:#ff4466}
        body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}
        .app{display:flex;height:100vh}
        .sidebar{width:60px;background:var(--card);display:flex;flex-direction:column;align-items:center;padding:12px 8px;gap:12px;z-index:20;transition:width .3s}
        .sidebar.expanded{width:180px}
        .sidebar-btn{width:44px;height:44px;border-radius:12px;background:rgba(0,191,255,.15);display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;transition:all .2s}
        .sidebar-btn:hover{background:rgba(0,191,255,.3)}
        .sidebar-label{font-size:10px;color:var(--dim);text-align:center;opacity:0;transition:opacity .2s}
        .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
        .w-title{font-size:28px;font-weight:700;letter-spacing:.5px;margin-top:8px}
        .w-sub{font-size:14px;color:var(--dim);line-height:1.6;margin-top:12px}
        .w-features{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin:24px 0}
        .feature{display:flex;align-items:center;gap:10px}
        .feature-icon{font-size:18px}
        .feature-text{font-size:13px;color:var(--dim)}
        .w-btn{width:200px;height:56px;border:none;border-radius:14px;background:linear-gradient(135deg,#0088ee,#0055aa);color:#fff;font-size:18px;font-weight:600;cursor:pointer;transition:all .15s;touch-action:manipulation}
        .w-btn:active{transform:scale(.95)}
        .w-back{margin-top:20px;color:var(--dim);font-size:12px;text-decoration:none}
    </style>
</head>
<body>
    <div class="app">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-btn" id="toggle-sidebar" title="Menu">☰</div>
            <div class="sidebar-btn" onclick="location.href='index.html'" title="Parler">🗣️</div>
            <div class="sidebar-label" id="lbl-chat">Chat</div>
            <div class="sidebar-btn" onclick="location.href='infos.html'" title="Infos">ℹ️</div>
            <div class="sidebar-label" id="lbl-info">Infos</div>
        </div>
        <div class="main">
            <div class="w-orb" style="width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#00ddff,#0066cc 55%,#001a33 80%,transparent);box-shadow:0 0 60px #00aaff44;animation:breathe 4s ease-in-out infinite"></div>
            <div class="w-title">IA App</div>
            <div class="w-sub">Assistant vocal IA avec vision</div>
            <div class="w-features">
                <div class="feature"><span class="feature-icon">🗣️</span><span class="feature-text">Assistant vocal</span></div>
                <div class="feature"><span class="feature-icon">👁️</span><span class="feature-text">Vision temps réel</span></div>
                <div class="feature"><span class="feature-icon">🧠</span><span class="feature-text">Mistral IA</span></div>
            </div>
            <button class="w-btn" onclick="location.href='index.html'">▶ Parler</button>
            <a href="index.html" class="w-back">← Assistant IA</a>
        </div>
    </div>
    <script>
        var sb=$('sidebar'),tb=$('toggle-sidebar');
        function toggleSidebar(){sb.classList.toggle('expanded');if(sb.classList.contains('expanded')){document.querySelectorAll('.sidebar-label').forEach(function(l){l.style.opacity='1';});}else{document.querySelectorAll('.sidebar-label').forEach(function(l){l.style.opacity='0';});}}
        tb.addEventListener('click',toggleSidebar);
        tb.addEventListener('touchend',function(e){e.preventDefault();toggleSidebar();});
    </script>
</body>
</html>
