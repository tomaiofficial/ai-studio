<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Assistant Mobile</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#050a14;color:#d0daf0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}
        .page{display:none;position:fixed;inset:0}
        .page.on{display:flex}
        #welcome{align-items:center;justify-content:center;gap:20px;padding:20px;text-align:center}
        .w-orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#00ddff,#0066cc);box-shadow:0 0 50px #00aaff44;animation:breathe 3s infinite}
        @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
        .w-title{font-size:26px;font-weight:700;margin-top:8px}
        .w-sub{font-size:13px;color:#556688;line-height:1.6;margin-top:12px}
        .w-btn{padding:16px 48px;border:none;border-radius:14px;background:linear-gradient(135deg,#0088ee,#0055aa);color:#fff;font-size:18px;cursor:pointer}
        .w-back{color:#556688;font-size:11px;margin-top:12px;text-decoration:none}
        #active{background:#000}
        .dot{width:8px;height:8px;border-radius:50%;background:#333}
        .dot.on{background:#00ff88;box-shadow:0 0 6px #00ff88}
        .lbl{font-size:11px;color:#556688}
        #orb{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#00ffaa,#007755);opacity:0;cursor:pointer}
        #orb.idle{opacity:.7;animation:breathe 3s ease-in-out infinite}
        #orb.rec{opacity:1;animation:rec 1.2s infinite;box-shadow:0 0 40px #00ffaa44}
        @keyframes rec{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
        #orb.speaking{opacity:1;animation:speak 1.2s infinite;box-shadow:0 0 50px #00ffaa66}
        @keyframes speak{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
    </style>
</head>
<body>
    <div id="welcome" class="page on">
        <div class="w-orb"></div>
        <div class="w-title">Assistant Mobile</div>
        <div class="w-sub">Demande-moi comment utiliser ton telephone ou aide-toi aux devoirs.</div>
        <button class="w-btn" id="go" onclick="start()">▶ Parler</button>
        <a href="index.html" class="w-back">← Assistant IA</a>
    </div>
    <div id="active" class="page">
        <div class="top">
            <div class="dot" id="dot"></div>
            <span class="lbl" id="lbl">En attente...</span>
        </div>
        <div id="orb-wrap"><div id="orb"></div></div>
    </div>
    <script>
        var API_HOST='https://ia-proxy.tom16112008.workers.dev';
        var VOICE_ID='c69964a6-ab8b-4f8a-9465-ec0925096ec8';
        var SYS_PROMPT="Tu es un expert mobile. Aide aux devoirs, explique les apps. Réponds en français. Sois concis.";
        var rec,active=false,speaking=false,waitingAI=false;
        var $ = function(id){return document.getElementById(id)};
        function stat(t,m){var d=$('dot'),l=$('lbl');d.className='dot';if(m==='on')d.classList.add('on');else if(m==='rec')d.classList.add('rec');else if(m==='talk')d.classList.add('talk');l.textContent=t;}
        function getAudioCtx(){if(!window.AudioContext&&!window.webkitAudioContext)return null;var c=new(window.AudioContext||window.webkitAudioContext)();if(c.state==='suspended')c.resume();return c;}
        function playAudio(b64){return new Promise(function(r){try{var c=getAudioCtx(),b=new Uint8Array(b64.length),u=b64.length;for(var i=0;i<u;i++)b[i]=b64.charCodeAt(i);c.decodeAudioData(b.buffer).then(function(buf){var s=c.createBufferSource();s.buffer=buf;s.connect(c.destination);s.onended=function(){r(true)};s.start(0);}).catch(function(){var bl=new Blob([b],{type:'audio/wav'}),u=URL.createObjectURL(bl),e=new Audio(u);e.onended=function(){URL.revokeObjectURL(u);r(true)};e.play();});}catch(e){r(false);}});}
        function callChat(m){return fetch(API_HOST+'/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'pixtral-12b-2409',messages:m,max_tokens:300,temperature:0.3})}).then(function(r){if(!r.ok)return r.json().then(function(e){throw new Error('Error '+r.status);});return r.json()}).then(function(d){return d.choices[0].message.content});}
        function callTTS(t){return fetch(API_HOST+'/v1/audio/speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'voxtral-mini-tts-2603',input:t,voice_id:VOICE_ID,response_format:'wav'})}).then(function(r){if(!r.ok)return'';return r.json()}).then(function(d){return d.audio_data||''});}
        function decodeB64(b){var r=atob(b),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u.buffer;}
        function onText(t){if(!t||waitingAI)return;waitingAI=true;stat('Réflexion...','on');var m=[{role:'system',content:SYS_PROMPT},{role:'user',content:t}];callChat(m).then(function(a){return callTTS(a).then(function(audio){return{aiText:a,audio:audio};});}).then(function(r){if(r&&r.audio){stat('Parle...','talk');var o=$('orb');o.className='speaking';playAudio(decodeB64(r.audio)).then(function(){stat('Connecté','on');waitingAI=false;});}else{stat('Connecté','on');waitingAI=false;}}).catch(function(e){stat('Connecté','on');waitingAI=false;});}
        function start(){var w=document.getElementById('welcome'),a=document.getElementById('active');w.classList.remove('on');a.classList.add('on');stat('Connecté','on');var s=window.SpeechRecognition||window.webkitSpeechRecognition;if(!s){alert('Speech non supporté');return;}rec=new s();rec.continuous=true;rec.interimResults=false;rec.lang='fr-FR';rec.onresult=function(e){for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal){var t=e.results[i][0].transcript.trim();if(t)onText(t);}}};rec.onend=function(){if(active)rec.start()};try{rec.start();var o=$('orb');o.className='rec';}catch(e){}}
        function toggleMic(){if(rec){rec.abort();rec=null;$('orb').className='idle';stat('Connecté','on');}else{start();}}
        $('orb').addEventListener('click',function(){toggleMic()});
        $('orb').addEventListener('touchend',function(e){e.preventDefault();toggleMic();});
    </script>
</body>
</html>
